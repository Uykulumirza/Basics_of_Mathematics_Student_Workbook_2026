<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basics of Mathematics — Student Workbook (Winter 2026)</title>
  
  <!-- Favicon / Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  
  <!-- KaTeX and Marked.js Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #f1f5f9;
      --border-color: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff6ff;
      --success: #16a34a;
      --success-light: #f0fdf4;
      --warning: #d97706;
      --warning-light: #fffbeb;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --sidebar-width: 320px;
      --header-height: 64px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    [data-theme="dark"] {
      --bg-primary: #0b1120;
      --bg-secondary: #0f172a;
      --bg-tertiary: #1e293b;
      --border-color: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-light: rgba(59, 130, 246, 0.15);
      --success: #22c55e;
      --success-light: rgba(34, 197, 94, 0.15);
      --warning: #f59e0b;
      --warning-light: rgba(245, 158, 11, 0.15);
      --danger: #ef4444;
      --danger-light: rgba(239, 68, 68, 0.15);
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    #sidebar {
      width: var(--sidebar-width);
      height: 100vh;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.3s ease;
      z-index: 50;
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: white;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .search-box {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
    }

    .module-group {
      margin-bottom: 16px;
    }

    .module-heading {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      margin: 2px 0;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-item:hover {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .nav-item.active {
      background-color: var(--accent-light);
      color: var(--accent);
      font-weight: 600;
    }

    .nav-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 8px;
    }

    .status-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 9999px;
      white-space: nowrap;
    }

    .status-badge.accepted {
      background-color: var(--success-light);
      color: var(--success);
    }

    .status-badge.submitted {
      background-color: var(--warning-light);
      color: var(--warning);
    }

    .status-badge.pending {
      background-color: var(--bg-tertiary);
      color: var(--text-muted);
    }

    /* Main Content Area */
    #main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Navbar / Header */
    header {
      height: var(--header-height);
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      padding: 6px;
      border-radius: var(--radius-sm);
    }

    .breadcrumbs {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .breadcrumbs span.active {
      color: var(--text-primary);
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 500;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: var(--bg-tertiary);
      border-color: var(--text-muted);
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      color: white;
    }

    /* View Tabs & Sub-Navigation */
    .view-bar {
      padding: 10px 24px;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      background-color: var(--bg-tertiary);
      padding: 3px;
      border-radius: var(--radius-md);
    }

    .tab-btn {
      padding: 6px 14px;
      border: none;
      background: none;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background-color: var(--bg-primary);
      color: var(--accent);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    /* Solutions Pills Bar */
    #problem-selector {
      display: none;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      max-width: 100%;
      padding-bottom: 2px;
    }

    .problem-pill {
      padding: 4px 10px;
      font-size: 0.78rem;
      font-weight: 500;
      border: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .problem-pill:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .problem-pill.active {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
      font-weight: 600;
    }

    .problem-pill.done::after {
      content: " ✓";
      color: var(--success);
      font-weight: 700;
    }

    .problem-pill.active.done::after {
      color: white;
    }

    /* Content Area */
    #content-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      background-color: var(--bg-primary);
    }

    .markdown-body {
      max-width: 860px;
      margin: 0 auto;
      color: var(--text-primary);
    }

    .markdown-body h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      font-weight: 700;
    }

    .markdown-body h2 {
      font-size: 1.4rem;
      margin-top: 28px;
      margin-bottom: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .markdown-body h3 {
      font-size: 1.15rem;
      margin-top: 22px;
      margin-bottom: 10px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .markdown-body p {
      margin-bottom: 14px;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .markdown-body ul, .markdown-body ol {
      margin-left: 24px;
      margin-bottom: 14px;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .markdown-body li {
      margin-bottom: 6px;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--accent);
      padding: 10px 16px;
      background-color: var(--bg-secondary);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      margin: 16px 0;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 0.9rem;
    }

    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      text-align: left;
    }

    .markdown-body th {
      background-color: var(--bg-secondary);
      font-weight: 600;
    }

    .markdown-body tr:nth-child(even) {
      background-color: var(--bg-tertiary);
    }

    .markdown-body pre {
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      overflow-x: auto;
      margin: 16px 0;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
    }

    .markdown-body code {
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      background-color: var(--bg-tertiary);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .markdown-body pre code {
      background: none;
      padding: 0;
    }

    /* Math rendering styling */
    .katex-display {
      margin: 16px 0 !important;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 0;
    }

    /* Loading and empty states */
    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      gap: 12px;
      color: var(--text-muted);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* --- Acceptance Tracker Dashboard Styles --- */
    .tracker-dashboard {
      max-width: 960px;
      margin: 0 auto;
    }

    .tracker-header {
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
    }

    .tracker-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .tracker-subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .stat-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: var(--shadow-sm);
    }

    .stat-card-val {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .stat-card-val.accepted { color: var(--success); }
    .stat-card-val.submitted { color: var(--warning); }
    .stat-card-val.pending { color: var(--text-muted); }
    .stat-card-val.total { color: var(--accent); }

    .stat-card-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .progress-bar-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
    }

    .progress-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .multi-progress {
      height: 14px;
      background-color: var(--bg-tertiary);
      border-radius: 9999px;
      overflow: hidden;
      display: flex;
    }

    .progress-seg {
      height: 100%;
      transition: width 0.3s ease;
    }

    .progress-seg.accepted { background-color: var(--success); }
    .progress-seg.submitted { background-color: var(--warning); }
    .progress-seg.pending { background-color: var(--border-color); }

    .progress-legend {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      font-size: 0.78rem;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .legend-dot.accepted { background-color: var(--success); }
    .legend-dot.submitted { background-color: var(--warning); }
    .legend-dot.pending { background-color: var(--text-muted); }

    .tracker-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      align-items: center;
    }

    .filter-chip {
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 500;
      border-radius: 9999px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-secondary);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-chip:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .filter-chip.active {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
      font-weight: 600;
    }

    .topic-status-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s;
    }

    .topic-status-card:hover {
      border-color: var(--accent);
    }

    .topic-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }

    .topic-meta-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .topic-meta-module {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .issue-review-box {
      margin: 12px 0 16px 0;
      padding: 12px 16px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-md);
      font-size: 0.88rem;
    }

    .issue-review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .issue-link-btn {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .issue-link-btn:hover {
      text-decoration: underline;
    }

    .prob-badges-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .prob-status-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .prob-status-cell:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
      border-color: var(--accent);
    }

    .prob-status-cell.accepted {
      background-color: var(--success-light);
      border-color: rgba(34, 197, 94, 0.4);
      color: var(--success);
    }

    .prob-status-cell.submitted {
      background-color: var(--warning-light);
      border-color: rgba(245, 158, 11, 0.4);
      color: var(--warning);
    }

    .prob-status-cell.pending {
      color: var(--text-muted);
      opacity: 0.8;
    }

    .cell-number {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .cell-label {
      font-size: 0.65rem;
      font-weight: 600;
      margin-top: 2px;
      text-transform: uppercase;
    }

    /* Responsive */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        transform: translateX(-100%);
      }
      #sidebar.open {
        transform: translateX(0);
      }
      .mobile-menu-btn {
        display: block;
      }
      #content-viewport {
        padding: 20px 16px;
      }
    }

    /* --- Geometry Plotter Styles --- */
    .plotter-dashboard {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .plotter-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
    }

    .plotter-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .plotter-subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .plotter-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .plotter-layout {
        grid-template-columns: 1fr;
      }
    }

    .plotter-sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .plotter-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }

    .plotter-card-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .preset-item {
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: var(--bg-primary);

    // --- Math + Markdown Parser ---
    function renderMarkdownWithKaTeX(markdownText) {
      if (!markdownText) return '<p>No content available.</p>';

      const mathBlocks = [];

      // 1. Protect Display Math ($$...$$)
      let protectedText = markdownText.replace(/\$\$([\s\S]+?)\$\$/g, (match, formula) => {
        mathBlocks.push({ type: 'display', formula: formula.trim() });
        return `@@MATH_BLOCK_${mathBlocks.length - 1}@@`;
      });

      // 2. Protect Inline Math ($...$)
      protectedText = protectedText.replace(/\$([^\$\n]+?)\$/g, (match, formula) => {
        mathBlocks.push({ type: 'inline', formula: formula.trim() });
        return `@@MATH_BLOCK_${mathBlocks.length - 1}@@`;
      });

      // 3. Parse Markdown
      let parsedHtml = marked.parse(protectedText);

      // 4. Restore and Render KaTeX
      parsedHtml = parsedHtml.replace(/@@MATH_BLOCK_(\d+)@@/g, (match, index) => {
        const item = mathBlocks[Number(index)];
        if (!item) return match;
        try {
          return katex.renderToString(item.formula, {
            displayMode: item.type === 'display',
            throwOnError: false
          });
        } catch (e) {
          console.error("KaTeX Error:", e);
          return `<span style="color:red;">${match}</span>`;
        }
      });

      return parsedHtml;
    }

    // --- Live GitHub API Sync ---
    async function syncWithGitHub() {
      const btn = document.getElementById('btn-sync-gh');
      if (btn) btn.innerHTML = '⏳ Syncing...';

      try {
        const resp = await fetch('https://api.github.com/repos/Uykulumirza/Basics_of_Mathematics_Student_Workbook_2026/issues?state=all');
        if (resp.ok) {
          const issues = await resp.json();
          issues.forEach(issue => {
            const title = issue.title || '';
            CURRICULUM.forEach(topic => {
              // Match topic folder name inside issue title
              if (topic.solutionsDir && title.includes(topic.solutionsDir.split('/').pop())) {
                topic.issueNumber = issue.number;
                topic.issueUrl = issue.html_url;
                topic.issueTitle = issue.title;
              }
            });
          });
          renderAcceptanceTracker();
          if (btn) btn.innerHTML = '✓ Synced with GitHub';
          setTimeout(() => { if (btn) btn.innerHTML = '🔄 Sync with GitHub Reviews'; }, 3000);
        } else {
          throw new Error('Rate limit or connection issue');
        }
      } catch (e) {
        console.warn('GitHub API sync note:', e);
        if (btn) btn.innerHTML = '✓ Using Local Data';
        setTimeout(() => { if (btn) btn.innerHTML = '🔄 Sync with GitHub Reviews'; }, 3000);
      }
    }

          <div class="spinner"></div>
          <div>Loading content...</div>
        </div>
      `;

      let targetUrl = '';
      if (currentTab === 'exercise' || topic.isOverview) {
        targetUrl = topic.exerciseFile;
      } else {
        const paddedIndex = String(currentProblemIndex).padStart(2, '0');
        targetUrl = `${topic.solutionsDir}/problem_${paddedIndex}_solution.md`;
      }

      try {
        const resp = await fetch(targetUrl);
        if (!resp.ok) {
          throw new Error(`HTTP ${resp.status}: Could not load ${targetUrl}`);
        }
        const text = await resp.text();
        if (text.trim().length === 0) {
          contentEl.innerHTML = `
            <div style="text-align:center; padding: 60px 20px;">
              <h2>Solution Not Started Yet</h2>
              <p style="color:var(--text-muted); margin-top:8px;">
                The template for <code>${targetUrl}</code> is currently awaiting solution.
              </p>
            </div>
          `;
        } else {
          contentEl.innerHTML = renderMarkdownWithKaTeX(text);
          enhanceArticleWithTurkishAndGlossary(contentEl);

        contentEl.innerHTML = `
          <div style="padding: 24px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background-color: var(--bg-secondary);">
            <h3 style="color:#ef4444; margin-bottom:8px;">Unable to load content file</h3>

            <p style="color:var(--text-muted); font-size:0.85rem; margin-top:8px;">${err.message}</p>
          </div>
        `;
      }
    }

    function selectTopic(id) {
      currentTopicId = id;
      const topic = CURRICULUM.find(t => t.id === currentTopicId);
      if (topic.isOverview) {
        currentTab = 'exercise';
      } else if (topic.isTracker) {
        switchTab('tracker');
        return;
      } else if (topic.isAlgebraLab) {
        switchTab('algebra');
        return;
      } else if (topic.isPlotter) {
        switchTab('plotter');
        return;
      } else if (currentTab === 'tracker' || currentTab === 'algebra' || currentTab === 'plotter') {
        currentTab = 'exercise';
      }
      document.getElementById('tab-exercise').classList.toggle('active', currentTab === 'exercise');
      document.getElementById('tab-solutions').classList.toggle('active', currentTab === 'solutions');
      document.getElementById('tab-tracker').classList.toggle('active', currentTab === 'tracker');
      const tabAlg = document.getElementById('tab-algebra');

      const tabPlot = document.getElementById('tab-plotter');
      if (tabPlot) tabPlot.classList.toggle('active', currentTab === 'plotter');
      buildSidebar();
      buildProblemSelector();
      loadCurrentContent();
      window.location.hash = `#${currentTopicId}`;

      document.getElementById('sidebar').classList.remove('open');

      currentTab = tab;
      document.getElementById('tab-exercise').classList.toggle('active', tab === 'exercise');

      document.getElementById('tab-tracker').classList.toggle('active', tab === 'tracker');

      const tabPlotter = document.getElementById('tab-plotter');
      if (tabPlotter) tabPlotter.classList.toggle('active', tab === 'plotter');
      
      const problemSelector = document.getElementById('problem-selector');
      if (problemSelector) {

      buildSidebar();

      window.location.hash = tab === 'tracker' ? '#tracker' : (tab === 'algebra' ? '#algebra' : (tab === 'plotter' ? '#plotter' : `#${currentTopicId}`));

    function buildProblemSelector() {
      const selector = document.getElementById('problem-selector');
      selector.innerHTML = '';
      const topic = CURRICULUM.find(t => t.id === currentTopicId);
      if (!topic || topic.isOverview || topic.isTracker || topic.isAlgebraLab || topic.isPlotter) return;

      const total = topic.totalProblems || 15;

    function renderMathInContainer(container) {
      if (!container || !window.katex) return;
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      while (walker.nextNode()) {
        textNodes.push(walker.currentNode);
      }
      textNodes.forEach(node => {
        const text = node.nodeValue;
        if (text && text.includes('$')) {
          const parent = node.parentNode;
          if (parent && parent.tagName !== 'SCRIPT' && parent.tagName !== 'STYLE') {
            const span = document.createElement('span');
            span.innerHTML = text.replace(/\$([^\$\n]+?)\$/g, (m, f) => {
              try {
                return katex.renderToString(f, { throwOnError: false });
              } catch(e) { return m; }
            });
            parent.replaceChild(span, node);
          }
        }
      });
    }

    let conicCanvasListenersBound = false;
    let isCanvasDragging = false;
    let dragStartX = 0, dragStartY = 0;

    function initConicCanvas() {
      const canvas = document.getElementById('conicCanvas');
      if (!canvas) return;

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const cx = rect.width / 2 + plotterState.offsetX;
        const cy = rect.height / 2 + plotterState.offsetY;
        const mathX = ((mx - cx) / plotterState.zoom).toFixed(2);
        const mathY = ((cy - my) / plotterState.zoom).toFixed(2);
        const badge = document.getElementById('canvas-coord-badge');
        if (badge) badge.textContent = `(x: ${mathX}, y: ${mathY})`;
      });

      canvas.addEventListener('mousedown', (e) => {
        isCanvasDragging = true;
        dragStartX = e.clientX - plotterState.offsetX;
        dragStartY = e.clientY - plotterState.offsetY;
        canvas.style.cursor = 'grabbing';
      });

      if (!conicCanvasListenersBound) {
        conicCanvasListenersBound = true;
        window.addEventListener('mouseup', () => {
          if (!isCanvasDragging) return;
          isCanvasDragging = false;
          const c = document.getElementById('conicCanvas');
          if (c) c.style.cursor = 'crosshair';
        });
        window.addEventListener('mousemove', (e) => {
          if (!isCanvasDragging) return;
          plotterState.offsetX = e.clientX - dragStartX;
          plotterState.offsetY = e.clientY - dragStartY;
          drawConicCanvas();
        });
      }

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 0.85;
        zoomPlotter(factor);
      }, { passive: false });
    }

    function setPlotterPreset(preset) {
      plotterState.preset = preset;
      const conf = PLOTTER_PRESETS[preset];
      if (conf) {
        if (conf.zoom) plotterState.zoom = conf.zoom;
        if (conf.offsetX !== undefined) plotterState.offsetX = conf.offsetX;
        plotterState.offsetY = 0;
        if (conf.a) plotterState.a = conf.a;
        if (conf.b) plotterState.b = conf.b;
        if (conf.p) plotterState.p = conf.p;
      }
      renderGeometryPlotter();
    }

    function setCustomType(type) {
      plotterState.customType = type;
      renderGeometryPlotter();
    }

    function updatePlotterParam(param, value) {
      plotterState[param] = parseFloat(value);
      const valEl = document.getElementById(`val-${param}`);
      if (valEl) valEl.textContent = value;

      const hintEl = document.getElementById('param-formula-hint');
      if (hintEl) {
        hintEl.innerHTML = buildParamFormulaHint(plotterState);
        renderMathInContainer(hintEl);
      }

      const tbodyEl = document.getElementById('math-details-tbody');
      if (tbodyEl) {
        tbodyEl.innerHTML = buildMathTableRows(plotterState);
        renderMathInContainer(tbodyEl);
      }

      drawConicCanvas();
    }

    function togglePlotterOption(opt, checked) {
      plotterState[opt] = checked;
      if (opt === 'showFoci') {
        plotterState.showDirectrix = checked;
      } else if (opt === 'showAsymptotes') {
        plotterState.showTangentBox = checked;
      }
      drawConicCanvas();
    }

    function zoomPlotter(factor) {
      plotterState.zoom = Math.max(8, Math.min(120, plotterState.zoom * factor));
      drawConicCanvas();
    }

    function resetPlotterView() {
      setPlotterPreset(plotterState.preset);
    }

    function drawConicCanvas() {
      const canvas = document.getElementById('conicCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();

      if (rect.width === 0 || rect.height === 0) return;

      const w = Math.round(rect.width);
      const h = Math.round(rect.height);

      if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
      }

      ctx.save();
      ctx.scale(dpr, dpr);

      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const bgColor = isDark ? '#0b1120' : '#ffffff';
      const gridColor = isDark ? 'rgba(51, 65, 85, 0.45)' : 'rgba(226, 232, 240, 0.9)';
      const axisColor = isDark ? '#94a3b8' : '#475569';
      const textColor = isDark ? '#cbd5e1' : '#334155';
      const textMuted = isDark ? '#64748b' : '#94a3b8';

      // Clear background
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, w, h);

      const cx = w / 2 + plotterState.offsetX;
      const cy = h / 2 + plotterState.offsetY;
      const zoom = plotterState.zoom;

      const toCanvasX = x => cx + x * zoom;
      const toCanvasY = y => cy - y * zoom;
      const toMathX = px => (px - cx) / zoom;
      const toMathY = py => (cy - py) / zoom;

      // 1. Grid
      if (plotterState.showGrid) {
        ctx.lineWidth = 1;
        ctx.strokeStyle = gridColor;
        ctx.beginPath();
        const minX = Math.floor(toMathX(0));
        const maxX = Math.ceil(toMathX(w));
        for (let x = minX; x <= maxX; x++) {
          const px = toCanvasX(x);
          ctx.moveTo(px, 0);
          ctx.lineTo(px, h);
        }
        const minY = Math.floor(toMathY(h));
        const maxY = Math.ceil(toMathY(0));
        for (let y = minY; y <= maxY; y++) {
          const py = toCanvasY(y);
          ctx.moveTo(0, py);
          ctx.lineTo(w, py);
        }
        ctx.stroke();
      }

      // 2. Axes
      ctx.lineWidth = 2;
      ctx.strokeStyle = axisColor;
      ctx.beginPath();
      // X-Axis
      ctx.moveTo(0, cy);
      ctx.lineTo(w, cy);
      // Y-Axis
      ctx.moveTo(cx, 0);
      ctx.lineTo(cx, h);
      ctx.stroke();

      // Axis labels
      ctx.fillStyle = textColor;
      ctx.font = 'bold 12px "Inter", sans-serif';
      ctx.fillText('x', w - 16, cy - 8);
      ctx.fillText('y', cx + 8, 16);

      // Tick numbers
      ctx.fillStyle = textMuted;
      ctx.font = '10px "Fira Code", monospace';
      const minX = Math.floor(toMathX(0));
      const maxX = Math.ceil(toMathX(w));
      const stepTick = zoom < 20 ? 2 : 1;
      for (let x = minX; x <= maxX; x += stepTick) {
        if (x === 0) continue;
        const px = toCanvasX(x);
        if (px > 20 && px < w - 20) {
          ctx.fillText(x, px - 6, cy + 14);
        }
      }
      const minY = Math.floor(toMathY(h));
      const maxY = Math.ceil(toMathY(0));
      for (let y = minY; y <= maxY; y += stepTick) {
        if (y === 0) continue;
        const py = toCanvasY(y);
        if (py > 20 && py < h - 20) {
          ctx.fillText(y, cx + 6, py + 4);
        }
      }
      ctx.fillText('0', cx - 12, cy + 14);

      // Helper for key points
      function drawKeyPoint(x, y, label, color = '#2563eb', align = 'top') {
        const px = toCanvasX(x);
        const py = toCanvasY(y);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(px, py, 4.5, 0, 2 * Math.PI);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        if (plotterState.showLabels && label) {
          ctx.fillStyle = textColor;
          ctx.font = 'bold 11px "Inter", sans-serif';
          const offY = align === 'top' ? -8 : 16;
          ctx.fillText(label, px + 8, py + offY);
        }
      }

      // Draw Curves based on Preset
      const p = plotterState;

      if (p.preset === 'ex1') {
        // Directrix of Parabola y^2 = 8x (x = -2)
        if (p.showDirectrix) {
          ctx.setLineDash([5, 4]);
          ctx.strokeStyle = 'rgba(16, 185, 129, 0.6)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(toCanvasX(-2), 0);
          ctx.lineTo(toCanvasX(-2), h);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Asymptotes of Hyperbola x^2/9 - y^2/4 = 1 (y = ±(2/3)x)
        if (p.showAsymptotes) {
          const leftX = toMathX(0);
          const rightX = toMathX(w);
          ctx.setLineDash([5, 4]);
          ctx.strokeStyle = 'rgba(245, 158, 11, 0.55)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(toCanvasX(leftX), toCanvasY((2 / 3) * leftX));
          ctx.lineTo(toCanvasX(rightX), toCanvasY((2 / 3) * rightX));
          ctx.moveTo(toCanvasX(leftX), toCanvasY(-(2 / 3) * leftX));
          ctx.lineTo(toCanvasX(rightX), toCanvasY(-(2 / 3) * rightX));
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Curve 1: Circle x^2 + y^2 = 9 (R=3)
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(cx, cy, 3 * zoom, 0, 2 * Math.PI);
        ctx.stroke();
        drawKeyPoint(3, 0, 'Circle (3,0)', '#2563eb');
        drawKeyPoint(0, 3, '(0,3)', '#2563eb');

        // Curve 2: Ellipse x^2/16 + y^2/9 = 1 (a=4, b=3)
        ctx.strokeStyle = '#8b5cf6';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 4 * zoom, 3 * zoom, 0, 0, 2 * Math.PI);
        ctx.stroke();
        drawKeyPoint(4, 0, 'Ellipse (4,0)', '#8b5cf6');

        // Curve 3: Parabola y^2 = 8x (p=4 ⟹ x = y^2 / 8)
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        const yMinEx1 = toMathY(h);
        const yMaxEx1 = toMathY(0);
        let firstP = true;
        for (let y = yMinEx1; y <= yMaxEx1; y += 0.05) {
          const x = (y * y) / 8;
          const px = toCanvasX(x);
          const py = toCanvasY(y);
          if (firstP) { ctx.moveTo(px, py); firstP = false; }
          else { ctx.lineTo(px, py); }
        }
        ctx.stroke();
        drawKeyPoint(0, 0, 'V(0,0)', '#10b981', 'bottom');
        drawKeyPoint(2, 4, 'Parabola (2,4)', '#10b981');
        drawKeyPoint(2, -4, '(2,-4)', '#10b981', 'bottom');
        if (p.showFoci) {
          drawKeyPoint(2, 0, 'F(2,0)', '#10b981');
        }

        // Curve 4: Hyperbola x^2/9 - y^2/4 = 1 (a=3, b=2)
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        let firstH1 = true;
        for (let y = yMinEx1; y <= yMaxEx1; y += 0.05) {
          const x = 3 * Math.sqrt(1 + (y * y) / 4);
          const px = toCanvasX(x);
          const py = toCanvasY(y);
          if (firstH1) { ctx.moveTo(px, py); firstH1 = false; } else ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.beginPath();
        let firstH2 = true;
        for (let y = yMinEx1; y <= yMaxEx1; y += 0.05) {
          const x = -3 * Math.sqrt(1 + (y * y) / 4);
          const px = toCanvasX(x);
          const py = toCanvasY(y);
          if (firstH2) { ctx.moveTo(px, py); firstH2 = false; } else ctx.lineTo(px, py);
        }
        ctx.stroke();
        drawKeyPoint(3, 0, 'Hyperbola V(3,0)', '#f59e0b', 'bottom');
        drawKeyPoint(-3, 0, 'V(-3,0)', '#f59e0b', 'bottom');
        if (p.showFoci) {
          const cHyp = Math.sqrt(13);
          drawKeyPoint(cHyp, 0, 'F2(√13,0)', '#ef4444');
          drawKeyPoint(-cHyp, 0, 'F1(-√13,0)', '#ef4444');
        }

      } else if (p.preset === 'ex3' || (p.preset === 'custom' && p.customType === 'ellipse')) {
        const a = p.a;
        const b = p.b;

        // Tangent box
        if (p.showAsymptotes && p.showTangentBox) {
          ctx.setLineDash([4, 4]);
          ctx.strokeStyle = isDark ? 'rgba(148, 163, 184, 0.4)' : 'rgba(100, 116, 139, 0.4)';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(toCanvasX(-a), toCanvasY(b), 2 * a * zoom, 2 * b * zoom);
          ctx.setLineDash([]);
        }

        // Ellipse curve
        ctx.strokeStyle = '#8b5cf6';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(cx, cy, a * zoom, b * zoom, 0, 0, 2 * Math.PI);
        ctx.stroke();

        // Vertices
        drawKeyPoint(a, 0, `A2(${a}, 0)`, '#8b5cf6');
        drawKeyPoint(-a, 0, `A1(-${a}, 0)`, '#8b5cf6');
        drawKeyPoint(0, b, `B2(0, ${b})`, '#8b5cf6');
        drawKeyPoint(0, -b, `B1(0, -${b})`, '#8b5cf6', 'bottom');

        // Foci
        if (p.showFoci) {
          const c = Math.sqrt(Math.abs(a * a - b * b));
          if (a >= b) {
            drawKeyPoint(c, 0, `F2(${c.toFixed(1)}, 0)`, '#ef4444');
            drawKeyPoint(-c, 0, `F1(-${c.toFixed(1)}, 0)`, '#ef4444');
          } else {
            drawKeyPoint(0, c, `F2(0, ${c.toFixed(1)})`, '#ef4444');
            drawKeyPoint(0, -c, `F1(0, -${c.toFixed(1)})`, '#ef4444', 'bottom');
          }
        }

      } else if (p.preset === 'ex4' || (p.preset === 'custom' && p.customType === 'parabola')) {
        const paramP = p.p;
        const focusX = paramP / 2;
        const directrixX = -paramP / 2;

        // Directrix
        if (p.showDirectrix) {
          ctx.setLineDash([6, 4]);
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(toCanvasX(directrixX), 0);
          ctx.lineTo(toCanvasX(directrixX), h);
          ctx.stroke();
          ctx.setLineDash([]);
          if (p.showLabels) {
            ctx.fillStyle = '#ef4444';
            ctx.font = 'bold 11px "Inter", sans-serif';
            ctx.fillText(`Directrix d: x = -${focusX}`, toCanvasX(directrixX) + 6, 24);
          }
        }

        // Parabola curve
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 3;
        ctx.beginPath();
        const yMinP = toMathY(h);
        const yMaxP = toMathY(0);
        let first = true;
        for (let y = yMinP; y <= yMaxP; y += 0.05) {
          const x = (y * y) / (2 * paramP);
          const px = toCanvasX(x);
          const py = toCanvasY(y);
          if (first) { ctx.moveTo(px, py); first = false; }
          else { ctx.lineTo(px, py); }
        }
        ctx.stroke();

        // Vertex
        drawKeyPoint(0, 0, 'V(0, 0)', '#10b981', 'bottom');

        // Focus
        if (p.showFoci) {
          drawKeyPoint(focusX, 0, `F(${focusX}, 0)`, '#ef4444');
        }

        // Latus Rectum Chord (at x = focusX)
        ctx.strokeStyle = '#8b5cf6';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(toCanvasX(focusX), toCanvasY(-paramP));
        ctx.lineTo(toCanvasX(focusX), toCanvasY(paramP));
        ctx.stroke();

        drawKeyPoint(focusX, paramP, `(${focusX}, ${paramP})`, '#8b5cf6');
        drawKeyPoint(focusX, -paramP, `(${focusX}, -${paramP})`, '#8b5cf6', 'bottom');

      } else if (p.preset === 'ex5' || (p.preset === 'custom' && p.customType === 'hyperbola')) {
        const a = p.a;
        const b = p.b;
        const c = Math.sqrt(a * a + b * b);

        const leftX = toMathX(0);
        const rightX = toMathX(w);

        // Fundamental rectangle
        if (p.showAsymptotes && p.showTangentBox) {
          ctx.setLineDash([4, 4]);
          ctx.strokeStyle = isDark ? 'rgba(148, 163, 184, 0.4)' : 'rgba(100, 116, 139, 0.4)';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(toCanvasX(-a), toCanvasY(b), 2 * a * zoom, 2 * b * zoom);
          ctx.setLineDash([]);
        }

        // Asymptotes lines
        if (p.showAsymptotes) {
          ctx.setLineDash([6, 4]);
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 1.5;

          ctx.beginPath();
          ctx.moveTo(toCanvasX(leftX), toCanvasY((b / a) * leftX));
          ctx.lineTo(toCanvasX(rightX), toCanvasY((b / a) * rightX));
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(toCanvasX(leftX), toCanvasY(-(b / a) * leftX));
          ctx.lineTo(toCanvasX(rightX), toCanvasY(-(b / a) * rightX));
          ctx.stroke();
          ctx.setLineDash([]);

          if (p.showLabels) {
            ctx.fillStyle = '#ef4444';
            ctx.font = 'bold 11px "Inter", sans-serif';
            ctx.fillText(`Asymptote y = ${(b/a).toFixed(2)}x`, w - 160, 24);
            ctx.fillText(`Asymptote y = -${(b/a).toFixed(2)}x`, w - 160, h - 20);
          }
        }

        // Hyperbola Branches
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 3;
        const yMinH = toMathY(h);
        const yMaxH = toMathY(0);

        // Right branch
        ctx.beginPath();
        for (let y = yMinH; y <= yMaxH; y += 0.05) {
          const x = a * Math.sqrt(1 + (y * y) / (b * b));
          const px = toCanvasX(x);
          const py = toCanvasY(y);
          if (y === yMinH) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Left branch
        ctx.beginPath();
        for (let y = yMinH; y <= yMaxH; y += 0.05) {
          const x = -a * Math.sqrt(1 + (y * y) / (b * b));
          const px = toCanvasX(x);
          const py = toCanvasY(y);
          if (y === yMinH) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Vertices
        drawKeyPoint(a, 0, `V2(${a}, 0)`, '#f59e0b');
        drawKeyPoint(-a, 0, `V1(-${a}, 0)`, '#f59e0b');

        // Foci
        if (p.showFoci) {
          drawKeyPoint(c, 0, `F2(${c.toFixed(1)}, 0)`, '#ef4444');
          drawKeyPoint(-c, 0, `F1(-${c.toFixed(1)}, 0)`, '#ef4444');
        }

      } else if (p.preset === 'custom' && p.customType === 'circle') {
        const R = p.R;
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, R * zoom, 0, 2 * Math.PI);
        ctx.stroke();

        drawKeyPoint(0, 0, 'Center (0,0)', '#2563eb', 'bottom');
        drawKeyPoint(R, 0, `(${R}, 0)`, '#2563eb');
        drawKeyPoint(0, R, `(0, ${R})`, '#2563eb');
      }

      ctx.restore();
    }

    // =========================================================================
    // 1. 🇹🇷 INTERACTIVE TURKISH TRANSLATION BUBBLE & GLOSSARY TOOLTIP SYSTEM
    // =========================================================================
    let inlineGlossaryEnabled = true;

    const MATH_GLOSSARY = [
      { en: 'Row Echelon Form (REF)', tr: 'Satır Eşelon Formu', cat: 'Algebra', desc: 'Matriste sıfır olmayan her satırın ilk sıfırdan farklı elemanı (pivot), bir üst satırın pivotunun sağında yer alır ($a_{ij} = 0, i > j$).' },

      { en: 'Determinant', tr: 'Determinant (det A)', cat: 'Algebra', desc: 'Kare matrisin tersinirliğini ($\\det A \\neq 0$) ve hacim ölçekleme çarpanını belirleyen skaler değer.' },

      { en: 'Rouché–Capelli Theorem', tr: 'Rouché–Capelli Teoremi', cat: 'Algebra', desc: '$Ax=b$ sisteminin çözülebilir olması için gerek ve yeter şart $\\text{rank}(A) = \\text{rank}([A \\mid b])$ olmasıdır.' },

    let currentGlossaryTab = 'dict';

    function toggleGlossaryDrawer(open) {
      const backdrop = document.getElementById('glossary-drawer-backdrop');
      if (!backdrop) return;
      const shouldOpen = open !== undefined ? open : !backdrop.classList.contains('open');
      backdrop.classList.toggle('open', shouldOpen);
      if (shouldOpen) {
        renderGlossaryDrawerContent();
      }
    }

    function switchGlossaryTab(tab) {
      currentGlossaryTab = tab;
      document.getElementById('drawer-tab-dict').classList.toggle('active', tab === 'dict');
      document.getElementById('drawer-tab-formulas').classList.toggle('active', tab === 'formulas');
      document.getElementById('glossary-search-bar').style.display = tab === 'dict' ? 'block' : 'none';
      renderGlossaryDrawerContent();
    }

    function renderGlossaryDrawerContent() {
      const body = document.getElementById('glossary-drawer-body');
      if (!body) return;

      if (currentGlossaryTab === 'dict') {
        const q = (document.getElementById('glossary-search-input')?.value || '').toLowerCase().trim();
        const filtered = MATH_GLOSSARY.filter(item =>
          !q ||
          item.en.toLowerCase().includes(q) ||
          item.tr.toLowerCase().includes(q) ||
          item.desc.toLowerCase().includes(q)
        );

        body.innerHTML = filtered.map(item => `
          <div class="glossary-item-card">
            <div class="glossary-item-head">
              <span class="glossary-en">${item.en}</span>
              <span class="glossary-tr">🇹🇷 ${item.tr}</span>
            </div>
            <div style="font-size:0.83rem; color:var(--text-secondary); line-height:1.5;">
              ${item.desc}
            </div>
          </div>
        `).join('') || `<div style="text-align:center; padding:30px; color:var(--text-muted);">Aranan terim bulunamadı.</div>`;
      } else {
        body.innerHTML = TOPIC_CHEATSHEETS.map(sec => `
          <div class="glossary-item-card" style="margin-bottom:14px;">
            <div style="font-weight:700; font-size:0.95rem; color:var(--accent); margin-bottom:8px;">
              ${sec.title}
            </div>
            <ul style="padding-left:18px; margin:0; font-size:0.84rem; color:var(--text-secondary); line-height:1.65;">
              ${sec.items.map(li => `<li style="margin-bottom:6px;">${li}</li>`).join('')}
            </ul>
          </div>
        `).join('');
      }

      renderMathInContainer(body);
    }

    // --- Section-Level Turkish Bubble Enhancement ---
    function enhanceArticleWithTurkishAndGlossary(contentEl) {
      if (!contentEl) return;

      // 1. Add top Study Assist Bar inside article-content
      const assistBar = document.createElement('div');
      assistBar.className = 'study-assist-bar';
      assistBar.innerHTML = `
        <div class="study-assist-left">
          <span style="font-weight:700; color:var(--text-primary);">🎓 Çalışma Araçları (Study Assistant):</span>
          <button type="button" class="tr-bubble-btn tr-master-btn" id="btn-translate-all" onclick="toggleAllTurkishBubbles()">
            🇹🇷 Tümünü Türkçeye Çevir (Translate All)
          </button>
          <button type="button" class="tr-bubble-btn glossary-open-btn" onclick="toggleGlossaryDrawer(true)">
            📘 TR Sözlük & Formül Özeti
          </button>
        </div>
        <div class="study-assist-right">
          <span style="font-size:0.75rem; color:var(--text-muted);">
            💡 İpucu: Başlıkların yanındaki <b>🇹🇷 Türkçe</b> balonuna tıklayarak Türkçe açıklamayı açıp kapatabilirsiniz.
          </span>
        </div>
      `;
      contentEl.insertBefore(assistBar, contentEl.firstChild);

      // 2. Attach a compact "🇹🇷 Türkçe" bubble button to every section heading (h1, h2, h3)
      const headings = Array.from(contentEl.querySelectorAll('h1, h2, h3'));
      headings.forEach((heading, idx) => {
        // Check if this heading has sibling content before the next heading
        const sectionNodes = getSectionNodesAfterHeading(heading);
        if (sectionNodes.length === 0 && heading.tagName === 'H1') return;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tr-bubble-btn';
        btn.dataset.sectionIdx = idx;
        btn.innerHTML = '🇹🇷 Türkçe';
        btn.title = 'Click to view Turkish translation / Tıklayarak Türkçe çeviriyi aç veya kapat';
        btn.onclick = (e) => {
          e.stopPropagation();
          toggleSectionTurkishBubble(heading, btn);
        };
        heading.appendChild(btn);
      });

      // 3. Apply inline glossary term tooltips
      if (inlineGlossaryEnabled) {
        applyInlineGlossaryTooltips(contentEl);
      }
    }

    function getSectionNodesAfterHeading(heading) {
      const nodes = [];
      let curr = heading.nextElementSibling;
      while (curr) {
        if (['H1', 'H2', 'H3', 'HR'].includes(curr.tagName)) break;
        if (!curr.classList.contains('tr-translation-bubble') && !curr.classList.contains('study-assist-bar')) {
          nodes.push(curr);
        }
        curr = curr.nextElementSibling;
      }
      return nodes;
    }

    async function toggleSectionTurkishBubble(heading, btn) {
      // Check if an open bubble already exists for this heading
      const existingBubble = heading.parentElement.querySelector(`.tr-translation-bubble[data-for-sec="${btn.dataset.sectionIdx}"]`);
      if (existingBubble) {
        // Close it completely so only English is visible!
        existingBubble.remove();
        btn.classList.remove('active');
        btn.innerHTML = '🇹🇷 Türkçe';
        updateMasterTranslateBtnState();
        return;
      }

      // Open bubble
      btn.classList.add('active');
      btn.innerHTML = '🇹🇷 Türkçe (Kapat ✕)';

      const sectionNodes = getSectionNodesAfterHeading(heading);
      const insertAfterEl = sectionNodes.length > 0 ? sectionNodes[sectionNodes.length - 1] : heading;

      const bubble = document.createElement('div');
      bubble.className = 'tr-translation-bubble';
      bubble.dataset.forSec = btn.dataset.sectionIdx;

      const cleanHeadingText = heading.cloneNode(true);
      cleanHeadingText.querySelectorAll('.tr-bubble-btn').forEach(b => b.remove());
      const headingPlain = cleanHeadingText.textContent.trim();

      bubble.innerHTML = `
        <div class="tr-bubble-header" title="Kapatmak için tıklayın (Click to close)">
          <span>🇹🇷 Türkçe Açıklama — ${translateMathHeadingLocally(headingPlain)}</span>
          <button type="button" class="tr-bubble-close">✕ Kapat (Close)</button>
        </div>
        <div class="tr-bubble-body">
          <div style="color:var(--text-muted); font-size:0.84rem;">⏳ Matematiksel ifadeler korunarak Türkçeye çevriliyor...</div>
        </div>
      `;

      // Clicking the bubble header or close button closes the bubble and leaves only English
      bubble.querySelector('.tr-bubble-header').onclick = () => {
        bubble.remove();
        btn.classList.remove('active');
        btn.innerHTML = '🇹🇷 Türkçe';
        updateMasterTranslateBtnState();
      };

      insertAfterEl.insertAdjacentElement('afterend', bubble);
      updateMasterTranslateBtnState();

      const bodyContainer = bubble.querySelector('.tr-bubble-body');
      await translateSectionNodesIntoContainer(sectionNodes, bodyContainer, headingPlain);
    }

    function updateMasterTranslateBtnState() {
      const masterBtn = document.getElementById('btn-translate-all');
      if (!masterBtn) return;
      const openBubbles = document.querySelectorAll('#article-content .tr-translation-bubble');
      if (openBubbles.length > 0) {
        masterBtn.classList.add('active');
        masterBtn.innerHTML = `🇹🇷 Tüm Türkçe Balonları Kapat (${openBubbles.length} Açık ✕)`;
      } else {
        masterBtn.classList.remove('active');
        masterBtn.innerHTML = '🇹🇷 Tümünü Türkçeye Çevir (Translate All)';
      }
    }

    async function toggleAllTurkishBubbles() {
      const contentEl = document.getElementById('article-content');
      if (!contentEl) return;
      const openBubbles = contentEl.querySelectorAll('.tr-translation-bubble');
      const allBtns = Array.from(contentEl.querySelectorAll('h1 .tr-bubble-btn, h2 .tr-bubble-btn, h3 .tr-bubble-btn'));

      if (openBubbles.length > 0) {
        openBubbles.forEach(b => b.remove());
        allBtns.forEach(btn => {
          btn.classList.remove('active');
          btn.innerHTML = '🇹🇷 Türkçe';
        });
        updateMasterTranslateBtnState();
      } else {
        for (const btn of allBtns) {
          const heading = btn.parentElement;
          if (heading) {
            await toggleSectionTurkishBubble(heading, btn);
          }
        }
      }
    }

      'Tasks': 'Görevler'
    };

    function translateMathHeadingLocally(text) {
      if (EXACT_HEADING_MAP[text]) return EXACT_HEADING_MAP[text];
      return text
        .replace(/^Exercise\s+(\d+)/i, 'Alıştırma $1')
        .replace(/^Problem\s+(\d+)/i, 'Problem $1')
        .replace(/^Step\s+(\d+)\s*:/i, 'Adım $1:')
        .replace(/^Part\s+(\d+|\([a-z]\))/i, 'Bölüm $1')
        .replace(/Solution/gi, 'Çözüm')
        .replace(/Verification/gi, 'Doğrulama')
        .replace(/Geometric Interpretation/gi, 'Geometrik Yorum')
        .replace(/Final Answer/gi, 'Nihai Cevap');
    }

    function refineTurkishMathTerminology(trText) {
      return trText
        .replace(/\bsatır kademeli form(u)?\b/gi, 'satır eşelon formu')
        .replace(/\bkademeli satır form(u)?\b/gi, 'satır eşelon formu')
        .replace(/\bindirgenmiş satır kademeli form(u)?\b/gi, 'indirgenmiş satır eşelon formu')
        .replace(/\bgeri ikame\b/gi, 'geri yerine koyma')
        .replace(/\bçapraz çarpım\b/gi, 'vektörel çarpım')
        .replace(/\bçarpık çizgiler\b/gi, 'aykırı doğrular')
        .replace(/\bçarpık doğrular\b/gi, 'aykırı doğrular')
        .replace(/\beğri çizgiler\b/gi, 'aykırı doğrular')
        .replace(/\bçekirdek\s*\(\s*boş alan\s*\)/gi, 'çekirdek (sıfır uzayı)')
        .replace(/\bboş uzay\b/gi, 'sıfır uzayı (null space)')
        .replace(/\bkanonik form\b/gi, 'kanonik (standart) form');
    }

    async function translateTextPreservingMathTokens(rawText) {
      const trimmed = rawText.trim();
      if (!trimmed) return rawText;
      if (EXACT_HEADING_MAP[trimmed]) return EXACT_HEADING_MAP[trimmed];

      const cacheKey = 'tr_cache_v2_' + trimmed;
      const cached = sessionStorage.getItem(cacheKey);
      if (cached) return cached;

      try {
        const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=tr&dt=t&q=' + encodeURIComponent(trimmed);
        const resp = await fetch(url);
        if (resp.ok) {
          const data = await resp.json();
          if (Array.isArray(data) && Array.isArray(data[0])) {
            let translated = data[0].map(part => part[0]).join('');
            translated = refineTurkishMathTerminology(translated);
            sessionStorage.setItem(cacheKey, translated);
            return translated;
          }
        }
      } catch (err) {
        console.warn('Translation fallback used:', err);
      }

      // Offline fallback dictionary replacement
      return translateMathHeadingLocally(trimmed);
    }

    async function translateSectionNodesIntoContainer(sectionNodes, targetContainer, headingPlain) {
      if (!sectionNodes || sectionNodes.length === 0) {
        targetContainer.innerHTML = `<p>${translateMathHeadingLocally(headingPlain)}</p>`;
        return;
      }

      // Clone nodes into a temporary wrapper
      const wrapper = document.createElement('div');
      sectionNodes.forEach(node => {
        // Skip ASCII art <pre> blocks in translation bubble so we don't duplicate giant coordinate grids
        if (node.tagName === 'PRE') return;
        wrapper.appendChild(node.cloneNode(true));
      });

      // Find translatable block elements (p, li, td, th, h4, blockquote)
      // Protect .katex, .katex-display, and code inside each block with placeholders [M0], [M1]...
      const blocks = Array.from(wrapper.querySelectorAll('p, li, td, th, h4, h5'));
      if (blocks.length === 0) {
        targetContainer.innerHTML = wrapper.innerHTML;
        return;
      }

      // Process blocks in parallel batches
      await Promise.all(blocks.map(async (block) => {
        // Skip blocks that contain nested block lists to avoid double-processing
        if (block.tagName === 'LI' && (block.querySelector('ul, ol, p'))) {
          // Only translate direct child text or let inner <p> handle it
          if (block.querySelector('p')) return;
        }

        const savedMathHtml = [];
        const cloneBlock = block.cloneNode(true);

        // Replace KaTeX & code elements with tokens {{M0}}, {{M1}}
        cloneBlock.querySelectorAll('.katex-display, .katex, code').forEach((mathEl) => {
          // Avoid replacing .katex inside .katex-display twice
          if (mathEl.classList.contains('katex') && mathEl.closest('.katex-display')) return;
          const idx = savedMathHtml.length;
          savedMathHtml.push(mathEl.outerHTML);
          const tokenNode = document.createTextNode(` [[M${idx}]] `);
          mathEl.replaceWith(tokenNode);
        });

        const plainWithTokens = cloneBlock.textContent.replace(/\s+/g, ' ').trim();
        // If the block is purely math tokens/numbers/punctuation, keep original
        const strippedAlpha = plainWithTokens.replace(/\[\[M\d+\]\]/g, '').replace(/[^a-zA-Z]/g, '');
        if (strippedAlpha.length < 2) {
          return;
        }

        let trText = await translateTextPreservingMathTokens(plainWithTokens);

        // Restore [[M0]] tokens (handling any spacing variations added by translator)
        trText = trText.replace(/\[\s*\[\s*[mM]\s*(\d+)\s*\]\s*\]/g, (_, numStr) => {
          const idx = parseInt(numStr, 10);
          return savedMathHtml[idx] !== undefined ? savedMathHtml[idx] : '';
        });

        block.innerHTML = trText;
      }));

      targetContainer.innerHTML = wrapper.innerHTML;
    }

    // --- Inline Math Glossary Tooltip Highlighter ---
    const INLINE_TERM_PATTERNS = [
      { regex: /\b(Reduced Row Echelon Form|RREF)\b/gi, termIdx: 1 },
      { regex: /\b(Row Echelon Form)\b/gi, termIdx: 0 },
      { regex: /\b(Gaussian [Ee]limination)\b/g, termIdx: 2 },
      { regex: /\b([Bb]ack-[Ss]ubstitution)\b/g, termIdx: 3 },
      { regex: /\b([Aa]ugmented [Mm]atrix)\b/g, termIdx: 4 },
      { regex: /\b([Cc]ofactor [Ee]xpansion)\b/g, termIdx: 7 },
      { regex: /\b([Aa]djugate [Mm]atrix)\b/g, termIdx: 9 },
      { regex: /\b([Ss]ingular [Mm]atrix)\b/g, termIdx: 11 },
      { regex: /\b(Rouché–Capelli|Rouché-Capelli)\b/g, termIdx: 16 },
      { regex: /\b(Cramer's [Rr]ule)\b/g, termIdx: 17 },
      { regex: /\b([Ss]calar [Tt]riple [Pp]roduct)\b/g, termIdx: 22 },
      { regex: /\b([Cc]oplanar)\b/gi, termIdx: 23 },
      { regex: /\b([Oo]rthogonal [Pp]rojection)\b/g, termIdx: 24 },
      { regex: /\b([Ss]kew [Ll]ines)\b/g, termIdx: 27 },
      { regex: /\b([Dd]irectrix)\b/gi, termIdx: 30 },
      { regex: /\b([Ee]ccentricity)\b/gi, termIdx: 31 },
      { regex: /\b([Ll]atus [Rr]ectum|[Ff]ocal [Cc]hord)\b/g, termIdx: 32 },
      { regex: /\b([Aa]symptotes?)\b/gi, termIdx: 33 },
      { regex: /\b([Hh]yperbolic [Pp]araboloid)\b/g, termIdx: 35 }
    ];

    function applyInlineGlossaryTooltips(container) {
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);

      nodes.forEach(node => {
        const parent = node.parentElement;
        if (!parent) return;
        if (parent.closest('.katex, code, pre, h1, h2, h3, button, .study-assist-bar, .tr-translation-bubble, .math-term-highlight')) return;

        let text = node.nodeValue;
        if (!text || text.trim().length < 4) return;

        let matched = false;
        let html = text;
        for (const pat of INLINE_TERM_PATTERNS) {
          if (pat.regex.test(html)) {
            matched = true;
            html = html.replace(pat.regex, (m) => `<span class="math-term-highlight" data-term-idx="${pat.termIdx}">${m}</span>`);
          }
        }

        if (matched) {
          const span = document.createElement('span');
          span.innerHTML = html;
          parent.replaceChild(span, node);
        }
      });

      container.querySelectorAll('.math-term-highlight').forEach(el => {
        el.addEventListener('mouseenter', showTermTooltip);
        el.addEventListener('mouseleave', hideTermTooltip);
      });
    }

    function showTermTooltip(e) {
      const popup = document.getElementById('math-term-tooltip');
      if (!popup) return;
      const idx = parseInt(e.currentTarget.dataset.termIdx, 10);
      const item = MATH_GLOSSARY[idx];

      popup.innerHTML = `
        <div style="font-weight:700; color:#e11d48; margin-bottom:3px;">🇹🇷 ${item.tr}</div>
        <div style="font-size:0.74rem; font-weight:600; color:var(--text-muted); margin-bottom:4px;">EN: ${item.en}</div>
        <div style="color:var(--text-primary);">${item.desc}</div>
      `;
      renderMathInContainer(popup);
      popup.style.display = 'block';

      const rect = e.currentTarget.getBoundingClientRect();
      const left = Math.min(window.innerWidth - 340, Math.max(12, rect.left));
      const top = rect.bottom + 8;
      popup.style.left = left + 'px';
      popup.style.top = top + 'px';
    }

    function hideTermTooltip() {
      const popup = document.getElementById('math-term-tooltip');
      if (popup) popup.style.display = 'none';
    }

    // =========================================================================
    // 2. 🧮 INTERACTIVE ALGEBRA LAB (Matrix & Linear System Step-by-Step Solver)
    // =========================================================================
    let algebraLabState = {
      size: 3,
      preset: 'sys_unique',
      A: [
        [2, 1, -1],
        [-3, -1, 2],
        [-2, 1, 2]
      ],
      b: [8, -11, -3]
    };

    const ALGEBRA_PRESETS = {
      sys_unique: {
        title: 'Topic 04: 3×3 Unique Solution System',
        subtitle: 'det(A) ≠ 0, rank(A) = rank([A|b]) = 3',
        size: 3,
        A: [[2, 1, -1], [-3, -1, 2], [-2, 1, 2]],
        b: [8, -11, -3],
        desc: 'Classic $3\\times 3$ non-singular system with unique solution $(x, y, z) = (2, 3, -1)$.'
      },
      sys_infinite: {
        title: 'Topic 04: Infinite Solutions (Free Parameter)',
        subtitle: 'det(A) = 0, rank(A) = rank([A|b]) = 2 < 3',
        size: 3,
        A: [[1, 2, -1], [2, 5, 1], [3, 7, 0]],
        b: [3, 9, 12],
        desc: 'Consistent underdetermined rank-2 system where $R_3 = R_1 + R_2$, yielding a 1-parameter family of solutions.'
      },
      sys_none: {
        title: 'Topic 04: Inconsistent System (No Solution)',
        subtitle: 'rank(A) = 2 < rank([A|b]) = 3',
        size: 3,
        A: [[1, -1, 2], [2, 1, -1], [3, 0, 1]],
        b: [4, 1, 10],
        desc: 'Inconsistent system where elimination produces a contradictory row $[0\\; 0\\; 0 \\mid 5]$.'
      },
      inv_2x2: {
        title: 'Topic 03: 2×2 Matrix Inverse & Cramer\'s Rule',
        subtitle: '2×2 Invertible Matrix & Linear System',
        size: 2,
        A: [[3, 2], [5, 4]],
        b: [7, 13],
        desc: '$2\\times 2$ matrix with $\\det(A) = 12 - 10 = 2 \\neq 0$.'
      }
    };

    function setAlgebraPreset(key) {
      const p = ALGEBRA_PRESETS[key];
      if (!p) return;
      algebraLabState.preset = key;
      algebraLabState.size = p.size;
      algebraLabState.A = p.A.map(r => [...r]);
      algebraLabState.b = [...p.b];
      renderAlgebraLab();
    }

    function setAlgebraSize(n) {
      algebraLabState.size = n;
      algebraLabState.preset = 'custom';
      if (n === 2) {
        algebraLabState.A = [[2, 1], [5, 3]];
        algebraLabState.b = [4, 11];
      } else {
        algebraLabState.A = [[2, 1, -1], [-3, -1, 2], [-2, 1, 2]];
        algebraLabState.b = [8, -11, -3];
      }
      renderAlgebraLab();
    }

    function updateAlgebraCell(type, r, c, val) {
      const num = parseFloat(val);
      const clean = isNaN(num) ? 0 : num;
      algebraLabState.preset = 'custom';
      if (type === 'A') {
        algebraLabState.A[r][c] = clean;
      } else {
        algebraLabState.b[r] = clean;
      }
      computeAndRenderAlgebraSteps();
    }

    function fmtNum(v) {
      if (Math.abs(v) < 1e-9) return '0';
      if (Math.abs(v - Math.round(v)) < 1e-7) return String(Math.round(v));
      return v.toFixed(2);
    }

    function matrixToLatex(M, isAugmented = false) {
      const rows = M.map(row => {
        if (!isAugmented) return row.map(fmtNum).join(' & ');
        const left = row.slice(0, row.length - 1).map(fmtNum).join(' & ');
        const right = fmtNum(row[row.length - 1]);
        return `${left} & \\big| & ${right}`;
      });
      return `\\begin{pmatrix} ${rows.join(' \\\\ ')} \\end{pmatrix}`;
    }

    function renderAlgebraLab() {
      const contentEl = document.getElementById('article-content');
      const breadcrumbs = document.getElementById('breadcrumbs');
      breadcrumbs.innerHTML = `<span>1. Algebra</span> / <span class="active">Interactive Algebra Lab (EN / TR)</span>`;

      const n = algebraLabState.size;
      let matrixInputsHtml = `<div class="matrix-input-grid" style="grid-template-columns: repeat(${n + 1}, 1fr);">`;
      for (let j = 0; j < n; j++) {
        matrixInputsHtml += `<div style="text-align:center; font-size:0.74rem; font-weight:700; color:var(--text-muted);">x<sub>${j+1}</sub></div>`;
      }
      matrixInputsHtml += `<div style="text-align:center; font-size:0.74rem; font-weight:700; color:#e11d48;">= b</div>`;

      for (let i = 0; i < n; i++) {
        for (let j = 0; j < n; j++) {
          matrixInputsHtml += `<input type="number" step="any" class="matrix-cell-input" value="${algebraLabState.A[i][j]}" oninput="updateAlgebraCell('A', ${i}, ${j}, this.value)">`;
        }
        matrixInputsHtml += `<input type="number" step="any" class="matrix-cell-input" style="border-color:rgba(225,29,72,0.4); background:rgba(225,29,72,0.04);" value="${algebraLabState.b[i]}" oninput="updateAlgebraCell('b', ${i}, 0, this.value)">`;
      }
      matrixInputsHtml += `</div>`;

      contentEl.innerHTML = `
        <div class="plotter-dashboard">
          <div class="plotter-header">
            <div>
              <h1 class="plotter-title">🧮 Interactive Algebra Lab (Matrix & Linear Systems)</h1>
              <div class="plotter-subtitle">
                Step-by-step Determinant, Matrix Inverse ($A^{-1}$), and Gaussian Elimination ($[A \\mid b] \\to \\text{RREF}$) with English & Turkish explanations
              </div>
            </div>
            <div class="plotter-mode-switch">
              <button class="plotter-mode-btn ${n === 2 ? 'active' : ''}" onclick="setAlgebraSize(2)">2×2 Matrix</button>
              <button class="plotter-mode-btn ${n === 3 ? 'active' : ''}" onclick="setAlgebraSize(3)">3×3 Matrix</button>
            </div>
          </div>

          <div class="algebra-grid-layout">
            <div class="plotter-sidebar">
              <div class="plotter-card">
                <div class="plotter-card-title">Workbook Problem Presets</div>
                <div class="preset-list">
                  ${Object.entries(ALGEBRA_PRESETS).map(([k, item]) => `
                    <div class="preset-item ${algebraLabState.preset === k ? 'active' : ''}" onclick="setAlgebraPreset('${k}')">
                      <div class="preset-item-header">
                        <span class="preset-name">${item.title}</span>
                      </div>
                      <span class="preset-math">${item.subtitle}</span>
                    </div>
                  `).join('')}
                </div>
              </div>

              <div class="plotter-card">
                <div class="plotter-card-title">Edit Matrix $A$ and Vector $b$ ($Ax = b$)</div>
                ${matrixInputsHtml}
                <div style="font-size:0.76rem; color:var(--text-muted); margin-top:6px;">
                  💡 Hücrelerdeki sayıları değiştirdiğinizde sağdaki tüm Gauss adımları ve determinant otomatik güncellenir.
                </div>
              </div>
            </div>

            <div id="algebra-steps-output"></div>
          </div>
        </div>
      `;

      computeAndRenderAlgebraSteps();
    }

    function computeAndRenderAlgebraSteps() {
      const outEl = document.getElementById('algebra-steps-output');
      if (!outEl) return;

      const n = algebraLabState.size;
      const A = algebraLabState.A.map(r => [...r]);
      const b = [...algebraLabState.b];

      // 1. Compute Determinant
      let det = 0;
      let detFormulaLatex = '';
      if (n === 2) {
        det = A[0][0] * A[1][1] - A[0][1] * A[1][0];
        detFormulaLatex = `\\det(A) = (${fmtNum(A[0][0])})(${fmtNum(A[1][1])}) - (${fmtNum(A[0][1])})(${fmtNum(A[1][0])}) = ${fmtNum(det)}`;
      } else {
        const m0 = A[1][1] * A[2][2] - A[1][2] * A[2][1];
        const m1 = A[1][0] * A[2][2] - A[1][2] * A[2][0];
        const m2 = A[1][0] * A[2][1] - A[1][1] * A[2][0];
        det = A[0][0] * m0 - A[0][1] * m1 + A[0][2] * m2;
        detFormulaLatex = `\\det(A) = ${fmtNum(A[0][0])}(${fmtNum(m0)}) - (${fmtNum(A[0][1])})(${fmtNum(m1)}) + (${fmtNum(A[0][2])})(${fmtNum(m2)}) = ${fmtNum(det)}`;
      }

      // 2. Gaussian Elimination with step recording on Augmented Matrix [A | b]
      const aug = A.map((row, i) => [...row, b[i]]);
      const steps = [];
      steps.push({
        badge: 'Initial Augmented Matrix / Başlangıç Genişletilmiş Matrisi',
        en: `Write the linear system $Ax = b$ in augmented matrix form $[A \\mid b]$:`,
        tr: `$Ax = b$ doğrusal denklem sistemini $[A \\mid b]$ genişletilmiş matris formunda yazalım:`,
        latex: matrixToLatex(aug, true)
      });

      let pivotRow = 0;
      const pivotCols = [];
      for (let col = 0; col < n && pivotRow < n; col++) {
        // Partial pivoting
        let maxRow = pivotRow;
        for (let r = pivotRow + 1; r < n; r++) {
          if (Math.abs(aug[r][col]) > Math.abs(aug[maxRow][col])) maxRow = r;
        }
        if (Math.abs(aug[maxRow][col]) < 1e-9) continue;

        if (maxRow !== pivotRow) {
          const tmp = aug[pivotRow];
          aug[pivotRow] = aug[maxRow];
          aug[maxRow] = tmp;
          steps.push({
            badge: `Row Swap / Satır Değişimi: R_${pivotRow + 1} ↔ R_${maxRow + 1}`,
            en: `Swap row $R_${pivotRow + 1}$ and row $R_${maxRow + 1}$ to bring a non-zero pivot to position $(${pivotRow + 1}, ${col + 1})$.`,
            tr: `Pivot konumuna sıfırdan farklı bir eleman getirmek için $R_${pivotRow + 1}$ ve $R_${maxRow + 1}$ satırlarını yer değiştirelim.`,
            latex: matrixToLatex(aug, true)
          });
        }

        pivotCols.push(col);
        const opsEn = [];
        const opsTr = [];
        for (let r = pivotRow + 1; r < n; r++) {
          if (Math.abs(aug[r][col]) > 1e-9) {
            const factor = aug[r][col] / aug[pivotRow][col];
            for (let c = col; c <= n; c++) {
              aug[r][c] -= factor * aug[pivotRow][c];
            }
            opsEn.push(`$R_${r + 1} \\leftarrow R_${r + 1} - (${fmtNum(factor)})R_${pivotRow + 1}$`);
            opsTr.push(`$R_${r + 1} \\leftarrow R_${r + 1} - (${fmtNum(factor)})R_${pivotRow + 1}$`);
          }
        }

        if (opsEn.length > 0) {
          steps.push({
            badge: `Eliminate Column ${col + 1} / ${col + 1}. Sütun Eliminasyonu`,
            en: `Apply elementary row operations ${opsEn.join(', ')} to zero out entries below the pivot:`,
            tr: `Pivotun altındaki elemanları sıfırlamak için ${opsTr.join(', ')} satır işlemlerini uygulayalım:`,
            latex: matrixToLatex(aug, true)
          });
        }
        pivotRow++;
      }

      // Compute ranks
      let rankA = 0;
      let rankAug = 0;
      for (let r = 0; r < n; r++) {
        const rowAZero = aug[r].slice(0, n).every(v => Math.abs(v) < 1e-8);
        const rowAugZero = aug[r].every(v => Math.abs(v) < 1e-8);
        if (!rowAZero) rankA++;
        if (!rowAugZero) rankAug++;
      }

      // Classification via Rouché-Capelli
      let statusSummaryEn = '';
      let statusSummaryTr = '';
      if (rankA < rankAug) {
        statusSummaryEn = `<b>Inconsistent System (No Solution):</b> Since $\\text{rank}(A) = ${rankA} < \\text{rank}([A \\mid b]) = ${rankAug}$, by the Rouché–Capelli theorem the system has <b>no solution</b> ($\\emptyset$).`;
        statusSummaryTr = `<b>Tutarsız Sistem (Çözüm Kümesi Boş):</b> Rouché–Capelli teoremine göre $\\text{rank}(A) = ${rankA} < \\text{rank}([A \\mid b]) = ${rankAug}$ olduğundan denklem sisteminin <b>hiçbir çözümü yoktur</b> ($\\emptyset$).`;
      } else if (rankA === n) {
        // Back-substitution for unique solution
        const sol = new Array(n).fill(0);
        for (let i = n - 1; i >= 0; i--) {
          let sum = aug[i][n];
          for (let j = i + 1; j < n; j++) sum -= aug[i][j] * sol[j];
          sol[i] = sum / aug[i][i];
        }
        const solVec = sol.map((v, idx) => `x_${idx + 1} = ${fmtNum(v)}`).join(',\\; ');
        statusSummaryEn = `<b>Unique Solution:</b> Since $\\det(A) = ${fmtNum(det)} \\neq 0$ and $\\text{rank}(A) = \\text{rank}([A \\mid b]) = ${n}$, back-substitution yields the unique solution: $$${solVec}$$`;
        statusSummaryTr = `<b>Tek Çözüm (Unique Solution):</b> $\\det(A) = ${fmtNum(det)} \\neq 0$ ve $\\text{rank}(A) = \\text{rank}([A \\mid b]) = ${n}$ olduğundan geri yerine koyma (back-substitution) ile tek çözüm bulunur: $$${solVec}$$`;
      } else {
        const freeCount = n - rankA;
        statusSummaryEn = `<b>Infinitely Many Solutions:</b> Since $\\text{rank}(A) = \\text{rank}([A \\mid b]) = ${rankA} < ${n}$, the system is consistent with <b>${freeCount} free parameter(s)</b> ($t \\in \\mathbb{R}$).`;
        statusSummaryTr = `<b>Sonsuz Çoklukta Çözüm:</b> $\\text{rank}(A) = \\text{rank}([A \\mid b]) = ${rankA} < ${n}$ olduğundan sistem tutarlıdır ve <b>${freeCount} serbest değişken (parametre)</b> içerir.`;
      }

      outEl.innerHTML = `
        <div class="step-card">
          <span class="step-badge">1. Determinant & Invertibility / Determinant ve Tersinirlik</span>
          <div style="margin:6px 0;">$$A = ${matrixToLatex(A, false)}, \\quad ${detFormulaLatex}$$</div>
          <div style="font-size:0.86rem; color:var(--text-secondary);">
            🇬🇧 ${Math.abs(det) > 1e-8 ? `Since $\\det(A) \\neq 0$, matrix $A$ is <b>non-singular (invertible)</b>.` : `Since $\\det(A) = 0$, matrix $A$ is <b>singular (non-invertible)</b>.`}
            <br>
