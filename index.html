    let is3DDragging = false;
    let last3DX = 0, last3DY = 0;

    function init3DCanvas() {
      const canvas = document.getElementById('surface3DCanvas');
      if (!canvas) return;
      canvas.addEventListener('mousedown', (e) => {
        is3DDragging = true;
        last3DX = e.clientX;
        last3DY = e.clientY;
        canvas.style.cursor = 'grabbing';
      });
      window.addEventListener('mouseup', () => {
        is3DDragging = false;
        const c = document.getElementById('surface3DCanvas');
        if (c) c.style.cursor = 'grab';
      });
      window.addEventListener('mousemove', (e) => {
        if (!is3DDragging) return;
        const dx = e.clientX - last3DX;
        const dy = e.clientY - last3DY;
        last3DX = e.clientX;
        last3DY = e.clientY;
        plotter3DState.yaw += dx * 0.01;
        plotter3DState.pitch = Math.max(-1.3, Math.min(1.3, plotter3DState.pitch + dy * 0.01));
        draw3DCanvas();
      });
    }

    function project3DPoint(x, y, z, cx, cy, scale, yaw, pitch) {
      // Rotate around Z-axis (yaw), then X/Y tilt (pitch)
      const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
      const x1 = x * cosY - y * sinY;
      const y1 = x * sinY + y * cosY;
      const cosP = Math.cos(pitch), sinP = Math.sin(pitch);
      const z2 = z * cosP - y1 * sinP;
      const depth = y1 * cosP + z * sinP;
      const persp = 1 / (1 + depth * 0.035);
      return {
        px: cx + x1 * scale * persp,
        py: cy - z2 * scale * persp,
        depth
      };
    }

    function draw3DCanvas() {
      const canvas = document.getElementById('surface3DCanvas');
      if (!canvas) return;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      const ctx = canvas.getContext('2d');
      ctx.save();
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      const w = rect.width, h = rect.height;
      const cx = w / 2, cy = h / 2 + 15;
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

      ctx.fillStyle = isDark ? '#0b1120' : '#f8fafc';
      ctx.fillRect(0, 0, w, h);

      const { yaw, pitch, zoom, preset, sliceZ, showSlice } = plotter3DState;
      const proj = (x, y, z) => project3DPoint(x, y, z, cx, cy, zoom, yaw, pitch);

      // Draw 3D coordinate axes
      const axes = [
        { to: [4.2, 0, 0], label: 'x', color: '#ef4444' },
        { to: [0, 4.2, 0], label: 'y', color: '#10b981' },
        { to: [0, 0, 4.0], label: 'z', color: '#3b82f6' }
      ];
      axes.forEach(ax => {
        const p0 = proj(-ax.to[0]*0.7, -ax.to[1]*0.7, -ax.to[2]*0.7);
        const p1 = proj(ax.to[0], ax.to[1], ax.to[2]);
        ctx.strokeStyle = ax.color;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(p0.px, p0.py);
        ctx.lineTo(p1.px, p1.py);
        ctx.stroke();
        ctx.fillStyle = ax.color;
        ctx.font = 'bold 13px Inter, sans-serif';
        ctx.fillText(ax.label, p1.px + 5, p1.py - 4);
      });

      const strokeCurve3D = (pts, color, width = 1.3, dash = []) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.setLineDash(dash);
        ctx.beginPath();
        pts.forEach((pt, idx) => {
          const p = proj(pt[0], pt[1], pt[2]);
          if (idx === 0) ctx.moveTo(p.px, p.py);
          else ctx.lineTo(p.px, p.py);
        });
        ctx.stroke();
        ctx.setLineDash([]);
      };

      const wireColor = isDark ? 'rgba(96, 165, 250, 0.52)' : 'rgba(37, 99, 235, 0.45)';

      if (preset === 'vectors') {
        const u = [2, 0, 1], v = [0, 2, 1], nVec = [-2, -2, 4];
        const pO = proj(0, 0, 0), pU = proj(...u), pV = proj(...v), pUV = proj(u[0]+v[0], u[1]+v[1], u[2]+v[2]);
        ctx.fillStyle = 'rgba(16, 185, 129, 0.18)';
        ctx.beginPath();
        ctx.moveTo(pO.px, pO.py);
        ctx.lineTo(pU.px, pU.py);
        ctx.lineTo(pUV.px, pUV.py);
        ctx.lineTo(pV.px, pV.py);
        ctx.closePath();
        ctx.fill();
        strokeCurve3D([[0,0,0], u], '#2563eb', 3.2);
        strokeCurve3D([[0,0,0], v], '#10b981', 3.2);
        strokeCurve3D([[0,0,0], nVec], '#e11d48', 3.4);
        ctx.fillStyle = isDark ? '#f8fafc' : '#0f172a';
        ctx.font = 'bold 12px Fira Code, monospace';
        ctx.fillText('u(2,0,1)', pU.px + 6, pU.py);
        ctx.fillText('v(0,2,1)', pV.px + 6, pV.py);
        const pN = proj(...nVec);
        ctx.fillStyle = '#e11d48';
        ctx.fillText('u × v = (-2,-2,4)', pN.px + 8, pN.py);
        ctx.restore();
        return;
      }

      // Parametric wireframe meshes for quadric surfaces
      if (preset === 'cylinder') {
        for (let z = -3; z <= 3; z += 0.6) {
          const ring = [];
          for (let t = 0; t <= Math.PI * 2 + 0.05; t += 0.15) ring.push([2 * Math.cos(t), 2 * Math.sin(t), z]);
          strokeCurve3D(ring, wireColor);
        }
        for (let t = 0; t < Math.PI * 2; t += Math.PI / 6) {
          strokeCurve3D([[2 * Math.cos(t), 2 * Math.sin(t), -3], [2 * Math.cos(t), 2 * Math.sin(t), 3]], wireColor);
        }
      } else if (preset === 'cone') {
        for (let z = -3; z <= 3; z += 0.5) {
          const r = Math.abs(z);
          const ring = [];
          for (let t = 0; t <= Math.PI * 2 + 0.05; t += 0.15) ring.push([r * Math.cos(t), r * Math.sin(t), z]);
          strokeCurve3D(ring, wireColor);
        }
        for (let t = 0; t < Math.PI * 2; t += Math.PI / 6) {
          strokeCurve3D([[-3 * Math.cos(t), -3 * Math.sin(t), -3], [3 * Math.cos(t), 3 * Math.sin(t), 3]], wireColor);
        }
      } else if (preset === 'ellipsoid') {
        const a = 3, b = 2, c = 2;
        for (let u = -Math.PI / 2; u <= Math.PI / 2; u += Math.PI / 10) {
          const ring = [];
          for (let v = 0; v <= Math.PI * 2 + 0.05; v += 0.15) {
            ring.push([a * Math.cos(u) * Math.cos(v), b * Math.cos(u) * Math.sin(v), c * Math.sin(u)]);
          }
          strokeCurve3D(ring, wireColor);
        }
        for (let v = 0; v < Math.PI * 2; v += Math.PI / 6) {
          const mer = [];
          for (let u = -Math.PI / 2; u <= Math.PI / 2; u += 0.15) {
            mer.push([a * Math.cos(u) * Math.cos(v), b * Math.cos(u) * Math.sin(v), c * Math.sin(u)]);
          }
          strokeCurve3D(mer, wireColor);
        }
      } else if (preset === 'paraboloid') {
        for (let r = 0.5; r <= 3.0; r += 0.5) {
          const z = (r * r) / 2.5;
          const ring = [];
          for (let t = 0; t <= Math.PI * 2 + 0.05; t += 0.15) ring.push([r * Math.cos(t), r * Math.sin(t), z]);
          strokeCurve3D(ring, wireColor);
        }
        for (let t = 0; t < Math.PI * 2; t += Math.PI / 6) {
          const rad = [];
          for (let r = 0; r <= 3.0; r += 0.2) rad.push([r * Math.cos(t), r * Math.sin(t), (r * r) / 2.5]);
          strokeCurve3D(rad, wireColor);
        }
      } else if (preset === 'saddle') {
        for (let x = -2.8; x <= 2.8; x += 0.4) {
          const line = [];
          for (let y = -2.8; y <= 2.8; y += 0.2) line.push([x, y, (x * x - y * y) / 3.2]);
          strokeCurve3D(line, wireColor);
        }
        for (let y = -2.8; y <= 2.8; y += 0.4) {
          const line = [];
          for (let x = -2.8; x <= 2.8; x += 0.2) line.push([x, y, (x * x - y * y) / 3.2]);
          strokeCurve3D(line, wireColor);
        }
      } else if (preset === 'hyp1') {
        for (let z = -2.8; z <= 2.8; z += 0.55) {
          const r = Math.sqrt(1.5 + z * z * 0.6);
          const ring = [];
          for (let t = 0; t <= Math.PI * 2 + 0.05; t += 0.15) ring.push([r * Math.cos(t), r * Math.sin(t), z]);
          strokeCurve3D(ring, wireColor);
        }
        for (let t = 0; t < Math.PI * 2; t += Math.PI / 6) {
          const mer = [];
          for (let z = -2.8; z <= 2.8; z += 0.2) {
            const r = Math.sqrt(1.5 + z * z * 0.6);
            mer.push([r * Math.cos(t), r * Math.sin(t), z]);
          }
          strokeCurve3D(mer, wireColor);
        }
      } else if (preset === 'hyp2') {
        [-1, 1].forEach(sign => {
          for (let u = 0; u <= 1.3; u += 0.26) {
            const z = sign * 1.4 * Math.cosh(u);
            const r = 1.4 * Math.sinh(u);
            const ring = [];
            for (let t = 0; t <= Math.PI * 2 + 0.05; t += 0.15) ring.push([r * Math.cos(t), r * Math.sin(t), z]);
            strokeCurve3D(ring, wireColor);
          }
        });
      }

      // Draw Horizontal Slice Plane z = sliceZ and highlight 2D Trace
      if (showSlice) {
        const planeCorners = [[-3.2, -3.2, sliceZ], [3.2, -3.2, sliceZ], [3.2, 3.2, sliceZ], [-3.2, 3.2, sliceZ], [-3.2, -3.2, sliceZ]];
        strokeCurve3D(planeCorners, 'rgba(225, 29, 72, 0.45)', 1.2, [4, 4]);

        const traceColor = '#e11d48';
        if (preset === 'cylinder') {
          const ring = [];
          for (let t = 0; t <= Math.PI * 2 + 0.05; t += 0.1) ring.push([2 * Math.cos(t), 2 * Math.sin(t), sliceZ]);
          strokeCurve3D(ring, traceColor, 3.2);
        } else if (preset === 'cone') {
          const r = Math.abs(sliceZ);
          const ring = [];
          for (let t = 0; t <= Math.PI * 2 + 0.05; t += 0.1) ring.push([r * Math.cos(t), r * Math.sin(t), sliceZ]);
          strokeCurve3D(ring, traceColor, 3.2);
        } else if (preset === 'ellipsoid' && Math.abs(sliceZ) <= 2) {
          const k = Math.sqrt(Math.max(0, 1 - (sliceZ * sliceZ) / 4));
          const ring = [];
          for (let t = 0; t <= Math.PI * 2 + 0.05; t += 0.1) ring.push([3 * k * Math.cos(t), 2 * k * Math.sin(t), sliceZ]);
          strokeCurve3D(ring, traceColor, 3.2);
        } else if (preset === 'paraboloid' && sliceZ >= 0) {
          const r = Math.sqrt(2.5 * sliceZ);
          const ring = [];
          for (let t = 0; t <= Math.PI * 2 + 0.05; t += 0.1) ring.push([r * Math.cos(t), r * Math.sin(t), sliceZ]);
          strokeCurve3D(ring, traceColor, 3.2);
        } else if (preset === 'hyp1') {
          const r = Math.sqrt(1.5 + sliceZ * sliceZ * 0.6);
          const ring = [];
          for (let t = 0; t <= Math.PI * 2 + 0.05; t += 0.1) ring.push([r * Math.cos(t), r * Math.sin(t), sliceZ]);
          strokeCurve3D(ring, traceColor, 3.2);
        } else if (preset === 'hyp2' && Math.abs(sliceZ) >= 1.4) {
          const r = Math.sqrt(Math.max(0, sliceZ * sliceZ - 1.96));
          const ring = [];
          for (let t = 0; t <= Math.PI * 2 + 0.05; t += 0.1) ring.push([r * Math.cos(t), r * Math.sin(t), sliceZ]);
          strokeCurve3D(ring, traceColor, 3.2);
        } else if (preset === 'saddle') {
          const cVal = sliceZ * 3.2;
          [-1, 1].forEach(sign => {
            const branch = [];
            for (let s = -2.4; s <= 2.4; s += 0.15) {
              if (cVal >= 0) {
                const x = sign * Math.sqrt(cVal + s * s);
                if (Math.abs(x) <= 3.0) branch.push([x, s, sliceZ]);
              } else {
                const y = sign * Math.sqrt(-cVal + s * s);
                if (Math.abs(y) <= 3.0) branch.push([s, y, sliceZ]);
              }
            }
            if (branch.length > 1) strokeCurve3D(branch, traceColor, 3.2);
          });
        }
      }

      ctx.restore();
    }

    // --- Search functionality ---
    document.getElementById('topic-search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      document.querySelectorAll('.nav-item').forEach(el => {
        const text = el.textContent.toLowerCase();
        el.style.display = text.includes(term) ? 'flex' : 'none';
      });
    });

    // --- Theme toggle ---
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    function applyTheme(isDark) {
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      themeIcon.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('math_workbook_theme', isDark ? 'dark' : 'light');
      if (currentTab === 'plotter') {
        if (plotterState.mode === '3d') draw3DCanvas();
        else drawConicCanvas();
      }
    }

    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      applyTheme(!isDark);
    });

    // Initialize Theme
    const savedTheme = localStorage.getItem('math_workbook_theme') || 
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme === 'dark');

    // Mobile Sidebar toggle
    document.getElementById('toggle-sidebar').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });

    // Window resize handler for canvas
    window.addEventListener('resize', () => {
      if (currentTab === 'plotter') {
        if (plotterState.mode === '3d') draw3DCanvas();
        else drawConicCanvas();
      }
    });

    // Initialize on Page Load
    window.addEventListener('DOMContentLoaded', () => {
      if (window.location.hash) {
        const hashId = window.location.hash.replace('#', '');
        if (hashId === 'tracker') {
          currentTab = 'tracker';
        } else if (hashId === 'algebra') {
          currentTab = 'algebra';
        } else if (hashId === 'plotter') {
          currentTab = 'plotter';
        } else if (CURRICULUM.some(t => t.id === hashId)) {
          currentTopicId = hashId;
        }
      }
      buildSidebar();
      buildProblemSelector();
      loadCurrentContent();
    });
  </script>
</body>
</html>
