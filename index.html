      --warning: #d97706;

    .brand-subtitle {

    }

      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-primary);

    }

    .sidebar-scroll {

    }

      text-decoration: none;

      margin: 20px 0;
      font-size: 0.9rem;

      align-items: center;

      height: 32px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent);

      animation: spin 0.8s linear infinite;

    // --- Math + Markdown Parser ---
    function renderMarkdownWithKaTeX(markdownText) {
      if (!markdownText) return '<p>No content available.</p>';

      const mathBlocks = [];

      // 1. Protect Display Math ($$...$$)
      let protectedText = markdownText.replace(/\$\$([\s\S]+?)\$\$/g, (match, formula) => {
        mathBlocks.push({ type: 'display', formula: formula.trim() });
        return `@@MATH_BLOCK_${mathBlocks.length - 1}@@`;
      });

      // 2. Protect Inline Math ($...$)
      protectedText = protectedText.replace(/\$([^\$\n]+?)\$/g, (match, formula) => {
        mathBlocks.push({ type: 'inline', formula: formula.trim() });
        return `@@MATH_BLOCK_${mathBlocks.length - 1}@@`;
      });

      // 3. Parse Markdown
      let parsedHtml = marked.parse(protectedText);

      // 4. Restore and Render KaTeX
      parsedHtml = parsedHtml.replace(/@@MATH_BLOCK_(\d+)@@/g, (match, index) => {
        const item = mathBlocks[Number(index)];
        if (!item) return match;
        try {
          return katex.renderToString(item.formula, {
            displayMode: item.type === 'display',
            throwOnError: false
          });
        } catch (e) {
          console.error("KaTeX Error:", e);
          return `<span style="color:red;">${match}</span>`;
        }
      });

      return parsedHtml;
    }

      navContainer.innerHTML = '';

      // Group by module
      const modules = {};
      CURRICULUM.forEach(item => {
        if (!modules[item.module]) modules[item.module] = [];
        modules[item.module].push(item);
      });

      for (const [moduleName, items] of Object.entries(modules)) {
        const groupEl = document.createElement('div');
        groupEl.className = 'module-group';

        const headingEl = document.createElement('div');
        headingEl.className = 'module-heading';
        headingEl.textContent = moduleName;
        groupEl.appendChild(headingEl);

        items.forEach(item => {
          const itemEl = document.createElement('div');
          itemEl.className = `nav-item ${item.id === currentTopicId ? 'active' : ''}`;
          itemEl.onclick = () => selectTopic(item.id);

          let badgeHtml = '';
          if (item.status === 'accepted') {
            badgeHtml = `<span class="status-badge accepted">✓ ${item.completedCount}/${item.totalProblems}</span>`;
          } else if (item.status === 'progress') {
            badgeHtml = `<span class="status-badge progress">${item.completedCount}/${item.totalProblems}</span>`;
          } else if (item.status === 'pending') {
            badgeHtml = `<span class="status-badge pending">0/${item.totalProblems}</span>`;
          }

          itemEl.innerHTML = `
            <span class="nav-item-title">${item.title}</span>
            ${badgeHtml}
          `;
          groupEl.appendChild(itemEl);
        });

        navContainer.appendChild(groupEl);
      }
    }

    // --- Content Loader ---
    async function loadCurrentContent() {
      const topic = CURRICULUM.find(t => t.id === currentTopicId);
      if (!topic) return;

      // Update Breadcrumbs
      const breadcrumbs = document.getElementById('breadcrumbs');
      breadcrumbs.innerHTML = `<span>${topic.module}</span> / <span class="active">${topic.title}</span>`;

      // Update Tab Bar visibility
      const problemSelector = document.getElementById('problem-selector');
      if (topic.isOverview) {
        document.querySelector('.view-bar').style.display = 'none';
      } else {
        document.querySelector('.view-bar').style.display = 'flex';
        problemSelector.style.display = currentTab === 'solutions' ? 'flex' : 'none';
      }

      const contentEl = document.getElementById('article-content');
      contentEl.innerHTML = `
        <div class="loading-spinner">
          <div class="spinner"></div>
          <div>Loading content...</div>
        </div>
      `;

      let targetUrl = '';
      if (currentTab === 'exercise' || topic.isOverview) {
        targetUrl = topic.exerciseFile;
      } else {
        const paddedIndex = String(currentProblemIndex).padStart(2, '0');
        targetUrl = `${topic.solutionsDir}/problem_${paddedIndex}_solution.md`;
      }

      try {
        const resp = await fetch(targetUrl);
        if (!resp.ok) {
          throw new Error(`HTTP ${resp.status}: Could not load ${targetUrl}`);
        }
        const text = await resp.text();
        if (text.trim().length === 0) {
          contentEl.innerHTML = `
            <div style="text-align:center; padding: 60px 20px;">
              <h2>Solution Not Started Yet</h2>
              <p style="color:var(--text-muted); margin-top:8px;">
                The template for <code>${targetUrl}</code> is currently awaiting solution.
              </p>
            </div>
          `;
        } else {
          contentEl.innerHTML = renderMarkdownWithKaTeX(text);
        }
      } catch (err) {
        contentEl.innerHTML = `
          <div style="padding: 24px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background-color: var(--bg-secondary);">
            <h3 style="color:#ef4444; margin-bottom:8px;">Unable to load content file</h3>
            <p>Target file: <code>${targetUrl}</code></p>
            <p style="color:var(--text-muted); font-size:0.85rem; margin-top:8px;">${err.message}</p>
          </div>
        `;
      }
    }

    // --- Action Handlers ---
    function selectTopic(id) {
      currentTopicId = id;
      const topic = CURRICULUM.find(t => t.id === currentTopicId);
      if (topic.isOverview) {
        currentTab = 'exercise';
      }
      buildSidebar();
      buildProblemSelector();
      loadCurrentContent();
      window.location.hash = `#${currentTopicId}`;

      // Close mobile menu
      document.getElementById('sidebar').classList.remove('open');
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-exercise').classList.toggle('active', tab === 'exercise');
      document.getElementById('tab-solutions').classList.toggle('active', tab === 'solutions');
      document.getElementById('problem-selector').style.display = tab === 'solutions' ? 'flex' : 'none';
      loadCurrentContent();
    }

    function selectProblem(index) {
      currentProblemIndex = index;
      buildProblemSelector();
      loadCurrentContent();
    }

    function buildProblemSelector() {
      const selector = document.getElementById('problem-selector');
      selector.innerHTML = '';
      const topic = CURRICULUM.find(t => t.id === currentTopicId);
      if (!topic || topic.isOverview) return;

      const total = topic.totalProblems || 15;
      for (let i = 1; i <= total; i++) {
        const pill = document.createElement('button');
        const isDone = i <= topic.completedCount;
        pill.className = `problem-pill ${i === currentProblemIndex ? 'active' : ''} ${isDone ? 'done' : ''}`;
        pill.textContent = `P${i}`;
        pill.title = `Problem ${i} ${isDone ? '(Completed)' : '(Pending)'}`;
        pill.onclick = () => selectProblem(i);
        selector.appendChild(pill);
      }
    }

    // --- Search functionality ---
    document.getElementById('topic-search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      document.querySelectorAll('.nav-item').forEach(el => {
        const text = el.textContent.toLowerCase();
        el.style.display = text.includes(term) ? 'flex' : 'none';
      });
    });

    // --- Theme toggle ---
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    function applyTheme(isDark) {
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      themeIcon.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('math_workbook_theme', isDark ? 'dark' : 'light');
    }

    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      applyTheme(!isDark);
    });

    // Initialize Theme
    const savedTheme = localStorage.getItem('math_workbook_theme') || 
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme === 'dark');

    // Mobile Sidebar toggle
    document.getElementById('toggle-sidebar').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });

    // Initialize on Page Load
    window.addEventListener('DOMContentLoaded', () => {
      if (window.location.hash) {
        const hashId = window.location.hash.replace('#', '');
        if (CURRICULUM.some(t => t.id === hashId)) {
          currentTopicId = hashId;
        }
      }
      buildSidebar();
      buildProblemSelector();
      loadCurrentContent();
    });
  </script>
</body>
</html>
