<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basics of Mathematics — Student Workbook (Winter 2026)</title>
  
  <!-- Favicon / Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  
  <!-- KaTeX and Marked.js Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #f1f5f9;
      --border-color: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff6ff;
      --success: #16a34a;
      --success-light: #f0fdf4;
      --warning: #d97706;
      --warning-light: #fffbeb;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --sidebar-width: 320px;
      --header-height: 64px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    [data-theme="dark"] {
      --bg-primary: #0b1120;
      --bg-secondary: #0f172a;
      --bg-tertiary: #1e293b;
      --border-color: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-light: rgba(59, 130, 246, 0.15);
      --success: #22c55e;
      --success-light: rgba(34, 197, 94, 0.15);
      --warning: #f59e0b;
      --warning-light: rgba(245, 158, 11, 0.15);
      --danger: #ef4444;
      --danger-light: rgba(239, 68, 68, 0.15);
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    #sidebar {
      width: var(--sidebar-width);
      height: 100vh;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.3s ease;
      z-index: 50;
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: white;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .search-box {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
    }

    .module-group {
      margin-bottom: 16px;
    }

    .module-heading {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      margin: 2px 0;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-item:hover {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .nav-item.active {
      background-color: var(--accent-light);
      color: var(--accent);
      font-weight: 600;
    }

    .nav-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 8px;
    }

    .status-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 9999px;
      white-space: nowrap;
    }

    .status-badge.accepted {
      background-color: var(--success-light);
      color: var(--success);
    }

    .status-badge.submitted {
      background-color: var(--warning-light);
      color: var(--warning);
    }

    .status-badge.pending {
      background-color: var(--bg-tertiary);
      color: var(--text-muted);
    }

    /* Main Content Area */
    #main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Navbar / Header */
    header {
      height: var(--header-height);
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      padding: 6px;
      border-radius: var(--radius-sm);
    }

    .breadcrumbs {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .breadcrumbs span.active {
      color: var(--text-primary);
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 500;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: var(--bg-tertiary);
      border-color: var(--text-muted);
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      color: white;
    }

    /* View Tabs & Sub-Navigation */
    .view-bar {
      padding: 10px 24px;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      background-color: var(--bg-tertiary);
      padding: 3px;
      border-radius: var(--radius-md);
    }

    .tab-btn {
      padding: 6px 14px;
      border: none;
      background: none;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background-color: var(--bg-primary);
      color: var(--accent);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    /* Solutions Pills Bar */
    #problem-selector {
      display: none;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      max-width: 100%;
      padding-bottom: 2px;
    }

    .problem-pill {
      padding: 4px 10px;
      font-size: 0.78rem;
      font-weight: 500;
      border: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .problem-pill:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .problem-pill.active {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
      font-weight: 600;
    }

    .problem-pill.done::after {
      content: " ✓";
      color: var(--success);
      font-weight: 700;
    }

    .problem-pill.active.done::after {
      color: white;
    }

    /* Content Area */
    #content-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      background-color: var(--bg-primary);
    }

    .markdown-body {
      max-width: 860px;
      margin: 0 auto;
      color: var(--text-primary);
    }

    .markdown-body h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      font-weight: 700;
    }

    .markdown-body h2 {
      font-size: 1.4rem;
      margin-top: 28px;
      margin-bottom: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .markdown-body h3 {
      font-size: 1.15rem;
      margin-top: 22px;
      margin-bottom: 10px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .markdown-body p {
      margin-bottom: 14px;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .markdown-body ul, .markdown-body ol {
      margin-left: 24px;
      margin-bottom: 14px;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .markdown-body li {
      margin-bottom: 6px;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--accent);
      padding: 10px 16px;
      background-color: var(--bg-secondary);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      margin: 16px 0;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 0.9rem;
    }

    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      text-align: left;
    }

    .markdown-body th {
      background-color: var(--bg-secondary);
      font-weight: 600;
    }

    .markdown-body tr:nth-child(even) {
      background-color: var(--bg-tertiary);
    }

    .markdown-body pre {
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      overflow-x: auto;
      margin: 16px 0;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
    }

    .markdown-body code {
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      background-color: var(--bg-tertiary);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .markdown-body pre code {
      background: none;
      padding: 0;
    }

    /* Math rendering styling */
    .katex-display {
      margin: 16px 0 !important;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 0;
    }

    /* Loading and empty states */
    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      gap: 12px;
      color: var(--text-muted);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* --- Acceptance Tracker Dashboard Styles --- */
    .tracker-dashboard {
      max-width: 960px;
      margin: 0 auto;
    }

    .tracker-header {
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
    }

    .tracker-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .tracker-subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .stat-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: var(--shadow-sm);
    }

    .stat-card-val {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .stat-card-val.accepted { color: var(--success); }
    .stat-card-val.submitted { color: var(--warning); }
    .stat-card-val.pending { color: var(--text-muted); }
    .stat-card-val.total { color: var(--accent); }

    .stat-card-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .progress-bar-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
    }

    .progress-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .multi-progress {
      height: 14px;
      background-color: var(--bg-tertiary);
      border-radius: 9999px;
      overflow: hidden;
      display: flex;
    }

    .progress-seg {
      height: 100%;
      transition: width 0.3s ease;
    }

    .progress-seg.accepted { background-color: var(--success); }
    .progress-seg.submitted { background-color: var(--warning); }
    .progress-seg.pending { background-color: var(--border-color); }

    .progress-legend {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      font-size: 0.78rem;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .legend-dot.accepted { background-color: var(--success); }
    .legend-dot.submitted { background-color: var(--warning); }
    .legend-dot.pending { background-color: var(--text-muted); }

    .tracker-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      align-items: center;
    }

    .filter-chip {
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 500;
      border-radius: 9999px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-secondary);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-chip:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .filter-chip.active {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
      font-weight: 600;
    }

    .topic-status-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s;
    }

    .topic-status-card:hover {
      border-color: var(--accent);
    }

    .topic-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }

    .topic-meta-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .topic-meta-module {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .issue-review-box {
      margin: 12px 0 16px 0;
      padding: 12px 16px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-md);
      font-size: 0.88rem;
    }

    .issue-review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .issue-link-btn {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .issue-link-btn:hover {
      text-decoration: underline;
    }

    .prob-badges-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .prob-status-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .prob-status-cell:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
      border-color: var(--accent);
    }

    .prob-status-cell.accepted {
      background-color: var(--success-light);
      border-color: rgba(34, 197, 94, 0.4);
      color: var(--success);
    }

    .prob-status-cell.submitted {
      background-color: var(--warning-light);
      border-color: rgba(245, 158, 11, 0.4);
      color: var(--warning);
    }

    .prob-status-cell.pending {
      color: var(--text-muted);
      opacity: 0.8;
    }

    .cell-number {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .cell-label {
      font-size: 0.65rem;
      font-weight: 600;
      margin-top: 2px;
      text-transform: uppercase;
    }

    /* Responsive */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        transform: translateX(-100%);
      }
      #sidebar.open {
        transform: translateX(0);
      }
      .mobile-menu-btn {
        display: block;
      }
      #content-viewport {
        padding: 20px 16px;
      }
    }

    /* --- Geometry Plotter Styles --- */
    .plotter-dashboard {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .plotter-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
    }

    .plotter-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .plotter-subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .plotter-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .plotter-layout {
        grid-template-columns: 1fr;
      }
    }

    .plotter-sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .plotter-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }

    .plotter-card-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .preset-item {
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: var(--bg-primary);

    // --- Math + Markdown Parser ---
    function renderMarkdownWithKaTeX(markdownText) {
      if (!markdownText) return '<p>No content available.</p>';

      const mathBlocks = [];

      // 1. Protect Display Math ($$...$$)
      let protectedText = markdownText.replace(/\$\$([\s\S]+?)\$\$/g, (match, formula) => {
        mathBlocks.push({ type: 'display', formula: formula.trim() });
        return `@@MATH_BLOCK_${mathBlocks.length - 1}@@`;
      });

      // 2. Protect Inline Math ($...$)
      protectedText = protectedText.replace(/\$([^\$\n]+?)\$/g, (match, formula) => {
        mathBlocks.push({ type: 'inline', formula: formula.trim() });
        return `@@MATH_BLOCK_${mathBlocks.length - 1}@@`;
      });

      // 3. Parse Markdown
      let parsedHtml = marked.parse(protectedText);

      // 4. Restore and Render KaTeX
      parsedHtml = parsedHtml.replace(/@@MATH_BLOCK_(\d+)@@/g, (match, index) => {
        const item = mathBlocks[Number(index)];
        if (!item) return match;
        try {
          return katex.renderToString(item.formula, {
            displayMode: item.type === 'display',
            throwOnError: false
          });
        } catch (e) {
          console.error("KaTeX Error:", e);
          return `<span style="color:red;">${match}</span>`;
        }
      });

      return parsedHtml;
    }

    // --- Live GitHub API Sync ---
    async function syncWithGitHub() {
      const btn = document.getElementById('btn-sync-gh');
      if (btn) btn.innerHTML = '⏳ Syncing...';

      try {
        const resp = await fetch('https://api.github.com/repos/Uykulumirza/Basics_of_Mathematics_Student_Workbook_2026/issues?state=all');
        if (resp.ok) {
          const issues = await resp.json();
          issues.forEach(issue => {
            const title = issue.title || '';
            CURRICULUM.forEach(topic => {
              // Match topic folder name inside issue title
              if (topic.solutionsDir && title.includes(topic.solutionsDir.split('/').pop())) {
                topic.issueNumber = issue.number;
                topic.issueUrl = issue.html_url;
                topic.issueTitle = issue.title;
              }
            });
          });
          renderAcceptanceTracker();
          if (btn) btn.innerHTML = '✓ Synced with GitHub';
          setTimeout(() => { if (btn) btn.innerHTML = '🔄 Sync with GitHub Reviews'; }, 3000);
        } else {
          throw new Error('Rate limit or connection issue');
        }
      } catch (e) {
        console.warn('GitHub API sync note:', e);
        if (btn) btn.innerHTML = '✓ Using Local Data';
        setTimeout(() => { if (btn) btn.innerHTML = '🔄 Sync with GitHub Reviews'; }, 3000);
      }
    }

    // --- Content Loader ---
    async function loadCurrentContent() {
      if (currentTab === 'tracker') {
        document.querySelector('.view-bar').style.display = 'flex';
        document.getElementById('problem-selector').style.display = 'none';
        renderAcceptanceTracker();
        return;
      }
      if (currentTab === 'plotter') {
        document.querySelector('.view-bar').style.display = 'flex';
        document.getElementById('problem-selector').style.display = 'none';
        renderGeometryPlotter();
        return;
      }

      const topic = CURRICULUM.find(t => t.id === currentTopicId);
      if (!topic) return;

      // Update Breadcrumbs
      const breadcrumbs = document.getElementById('breadcrumbs');
      breadcrumbs.innerHTML = `<span>${topic.module}</span> / <span class="active">${topic.title}</span>`;

      // Update Tab Bar visibility
      const problemSelector = document.getElementById('problem-selector');
      if (topic.isOverview) {
        document.querySelector('.view-bar').style.display = 'none';
      } else {
        document.querySelector('.view-bar').style.display = 'flex';
        problemSelector.style.display = currentTab === 'solutions' ? 'flex' : 'none';
      }

      const contentEl = document.getElementById('article-content');
      contentEl.innerHTML = `
        <div class="loading-spinner">
          <div class="spinner"></div>
          <div>Loading content...</div>
        </div>
      `;

      let targetUrl = '';
      if (currentTab === 'exercise' || topic.isOverview) {
        targetUrl = topic.exerciseFile;
      } else {
        const paddedIndex = String(currentProblemIndex).padStart(2, '0');
        targetUrl = `${topic.solutionsDir}/problem_${paddedIndex}_solution.md`;
      }

      try {
        const resp = await fetch(targetUrl);
        if (!resp.ok) {
          throw new Error(`HTTP ${resp.status}: Could not load ${targetUrl}`);
        }
        const text = await resp.text();
        if (text.trim().length === 0) {
          contentEl.innerHTML = `
            <div style="text-align:center; padding: 60px 20px;">
              <h2>Solution Not Started Yet</h2>
              <p style="color:var(--text-muted); margin-top:8px;">
                The template for <code>${targetUrl}</code> is currently awaiting solution.
              </p>
            </div>
          `;
        } else {
          contentEl.innerHTML = renderMarkdownWithKaTeX(text);
        }
      } catch (err) {
        contentEl.innerHTML = `
          <div style="padding: 24px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background-color: var(--bg-secondary);">
            <h3 style="color:#ef4444; margin-bottom:8px;">Unable to load content file</h3>
            <p>Target file: <code>${targetUrl}</code></p>
            <p style="color:var(--text-muted); font-size:0.85rem; margin-top:8px;">${err.message}</p>
          </div>
        `;
      }
    }

    // --- Action Handlers ---
    function selectTopic(id) {
      currentTopicId = id;
      const topic = CURRICULUM.find(t => t.id === currentTopicId);
      if (topic.isOverview) {
        currentTab = 'exercise';
      } else if (topic.isTracker) {
        switchTab('tracker');
        return;
      } else if (topic.isPlotter) {
        switchTab('plotter');
        return;
      }
      buildSidebar();
      buildProblemSelector();
      loadCurrentContent();
      window.location.hash = `#${currentTopicId}`;

      // Close mobile menu
      document.getElementById('sidebar').classList.remove('open');
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-exercise').classList.toggle('active', tab === 'exercise');
      document.getElementById('tab-solutions').classList.toggle('active', tab === 'solutions');
      document.getElementById('tab-tracker').classList.toggle('active', tab === 'tracker');
      const tabPlotter = document.getElementById('tab-plotter');
      if (tabPlotter) tabPlotter.classList.toggle('active', tab === 'plotter');
      
      const problemSelector = document.getElementById('problem-selector');
      if (problemSelector) {
        problemSelector.style.display = tab === 'solutions' ? 'flex' : 'none';
      }

      buildSidebar();
      if (tab !== 'tracker' && tab !== 'plotter') {
        buildProblemSelector();
      }
      loadCurrentContent();
      window.location.hash = tab === 'tracker' ? '#tracker' : (tab === 'plotter' ? '#plotter' : `#${currentTopicId}`);
    }

    function selectProblem(index) {
      currentProblemIndex = index;
      buildProblemSelector();
      loadCurrentContent();
    }

    function buildProblemSelector() {
      const selector = document.getElementById('problem-selector');
      selector.innerHTML = '';
      const topic = CURRICULUM.find(t => t.id === currentTopicId);
      if (!topic || topic.isOverview || topic.isTracker || topic.isPlotter) return;

      const total = topic.totalProblems || 15;
      for (let i = 1; i <= total; i++) {
        const pill = document.createElement('button');
        const isDone = (topic.acceptedCount && i <= topic.acceptedCount) || 
                       (topic.submittedProblems ? topic.submittedProblems.includes(i) : (topic.submittedCount && i <= topic.submittedCount));
        pill.className = `problem-pill ${i === currentProblemIndex ? 'active' : ''} ${isDone ? 'done' : ''}`;
        pill.textContent = `P${i}`;
        pill.title = `Problem ${i} ${isDone ? '(Completed)' : '(Pending)'}`;
        pill.onclick = () => selectProblem(i);
        selector.appendChild(pill);
      }
    }

                    </div>

                    <div class="preset-item-header">

              <!-- Curve Parameters -->
              <div class="plotter-card">

              <!-- Visual Toggles -->

                <div class="plotter-card-title">Display Toggles</div>
                <div class="toggle-list">
                  <label class="toggle-label">
                    <input type="checkbox" ${pState.showGrid ? 'checked' : ''} onchange="togglePlotterOption('showGrid', this.checked)">

                  </label>
                  <label class="toggle-label">

            <!-- Canvas Viewport -->
            <div class="canvas-container-card">
              <div class="canvas-toolbar">
                <div style="font-size:0.95rem; font-weight:700; color:var(--text-primary);">
                  ${currentPreset.title}
                </div>
                <div class="canvas-tools-group">
                  <div class="coord-display" id="canvas-coord-badge">(x: 0.00, y: 0.00)</div>
                  <button class="canvas-btn" onclick="zoomPlotter(1.2)" title="Zoom In">+</button>
                  <button class="canvas-btn" onclick="zoomPlotter(0.8)" title="Zoom Out">−</button>
                  <button class="canvas-btn" onclick="resetPlotterView()" title="Reset View">↺ Reset</button>
                </div>
              </div>

              <div class="canvas-frame" id="canvas-frame">
                <canvas id="conicCanvas"></canvas>
              </div>

              <div style="font-size:0.85rem; color:var(--text-secondary); line-height:1.5;">

      `;

      // KaTeX rendering inside container
      renderMathInContainer(contentEl);

      // Initialize Canvas
      initConicCanvas();
      drawConicCanvas();
    }

    function renderMathInContainer(container) {
      if (!container || !window.katex) return;
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      while (walker.nextNode()) {
        textNodes.push(walker.currentNode);
      }
      textNodes.forEach(node => {
        const text = node.nodeValue;
        if (text && text.includes('$')) {
          const parent = node.parentNode;
          if (parent && parent.tagName !== 'SCRIPT' && parent.tagName !== 'STYLE') {
            const span = document.createElement('span');
            span.innerHTML = text.replace(/\$([^\$\n]+?)\$/g, (m, f) => {
              try {
                return katex.renderToString(f, { throwOnError: false });
              } catch(e) { return m; }
            });
            parent.replaceChild(span, node);
          }
        }
      });
    }

    function initConicCanvas() {
      const canvas = document.getElementById('conicCanvas');
      if (!canvas) return;

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const cx = rect.width / 2 + plotterState.offsetX;
        const cy = rect.height / 2 + plotterState.offsetY;
        const mathX = ((mx - cx) / plotterState.zoom).toFixed(2);
        const mathY = ((cy - my) / plotterState.zoom).toFixed(2);
        const badge = document.getElementById('canvas-coord-badge');
        if (badge) badge.textContent = `(x: ${mathX}, y: ${mathY})`;
      });

      let isDragging = false;
      let startX = 0, startY = 0;
      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX - plotterState.offsetX;
        startY = e.clientY - plotterState.offsetY;
        canvas.style.cursor = 'grabbing';
      });
      window.addEventListener('mouseup', () => {
        isDragging = false;
        if (canvas) canvas.style.cursor = 'crosshair';
      });
      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        plotterState.offsetX = e.clientX - startX;
        plotterState.offsetY = e.clientY - startY;
        drawConicCanvas();
      });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 0.85;
        zoomPlotter(factor);
      }, { passive: false });
    }

    function setPlotterPreset(preset) {
      plotterState.preset = preset;
      const conf = PLOTTER_PRESETS[preset];
      if (conf) {
        if (conf.zoom) plotterState.zoom = conf.zoom;
        if (conf.offsetX !== undefined) plotterState.offsetX = conf.offsetX;
        plotterState.offsetY = 0;
        if (conf.a) plotterState.a = conf.a;
        if (conf.b) plotterState.b = conf.b;
        if (conf.p) plotterState.p = conf.p;
      }
      renderGeometryPlotter();
    }

    function setCustomType(type) {
      plotterState.customType = type;
      renderGeometryPlotter();
    }

    function updatePlotterParam(param, value) {
      plotterState[param] = parseFloat(value);
      const valEl = document.getElementById(`val-${param}`);
      if (valEl) valEl.textContent = value;
      drawConicCanvas();
    }

    function togglePlotterOption(opt, checked) {
      plotterState[opt] = checked;
      drawConicCanvas();
    }

    function zoomPlotter(factor) {
      plotterState.zoom = Math.max(8, Math.min(120, plotterState.zoom * factor));
      drawConicCanvas();
    }

    function resetPlotterView() {
      setPlotterPreset(plotterState.preset);
    }

    function drawConicCanvas() {
      const canvas = document.getElementById('conicCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();

      if (rect.width === 0 || rect.height === 0) return;

      const w = Math.round(rect.width);
      const h = Math.round(rect.height);

      if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
      }

      ctx.save();
      ctx.scale(dpr, dpr);

      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const bgColor = isDark ? '#0b1120' : '#ffffff';
      const gridColor = isDark ? 'rgba(51, 65, 85, 0.45)' : 'rgba(226, 232, 240, 0.9)';
      const axisColor = isDark ? '#94a3b8' : '#475569';
      const textColor = isDark ? '#cbd5e1' : '#334155';
      const textMuted = isDark ? '#64748b' : '#94a3b8';

      // Clear background
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, w, h);

      const cx = w / 2 + plotterState.offsetX;
      const cy = h / 2 + plotterState.offsetY;
      const zoom = plotterState.zoom;

      const toCanvasX = x => cx + x * zoom;
      const toCanvasY = y => cy - y * zoom;
      const toMathX = px => (px - cx) / zoom;
      const toMathY = py => (cy - py) / zoom;

      // 1. Grid
      if (plotterState.showGrid) {
        ctx.lineWidth = 1;
        ctx.strokeStyle = gridColor;
        ctx.beginPath();
        const minX = Math.floor(toMathX(0));
        const maxX = Math.ceil(toMathX(w));
        for (let x = minX; x <= maxX; x++) {
          const px = toCanvasX(x);
          ctx.moveTo(px, 0);
          ctx.lineTo(px, h);
        }
        const minY = Math.floor(toMathY(h));
        const maxY = Math.ceil(toMathY(0));
        for (let y = minY; y <= maxY; y++) {
          const py = toCanvasY(y);
          ctx.moveTo(0, py);
          ctx.lineTo(w, py);
        }
        ctx.stroke();
      }

      // 2. Axes
      ctx.lineWidth = 2;
      ctx.strokeStyle = axisColor;
      ctx.beginPath();
      // X-Axis
      ctx.moveTo(0, cy);
      ctx.lineTo(w, cy);
      // Y-Axis
      ctx.moveTo(cx, 0);
      ctx.lineTo(cx, h);
      ctx.stroke();

      // Axis labels
      ctx.fillStyle = textColor;
      ctx.font = 'bold 12px "Inter", sans-serif';
      ctx.fillText('x', w - 16, cy - 8);
      ctx.fillText('y', cx + 8, 16);

      // Tick numbers
      ctx.fillStyle = textMuted;
      ctx.font = '10px "Fira Code", monospace';
      const minX = Math.floor(toMathX(0));
      const maxX = Math.ceil(toMathX(w));
      const stepTick = zoom < 20 ? 2 : 1;
      for (let x = minX; x <= maxX; x += stepTick) {
        if (x === 0) continue;
        const px = toCanvasX(x);
        if (px > 20 && px < w - 20) {
          ctx.fillText(x, px - 6, cy + 14);
        }
      }
      const minY = Math.floor(toMathY(h));
      const maxY = Math.ceil(toMathY(0));
      for (let y = minY; y <= maxY; y += stepTick) {
        if (y === 0) continue;
        const py = toCanvasY(y);
        if (py > 20 && py < h - 20) {
          ctx.fillText(y, cx + 6, py + 4);
        }
      }
      ctx.fillText('0', cx - 12, cy + 14);

      // Helper for key points
      function drawKeyPoint(x, y, label, color = '#2563eb', align = 'top') {
        const px = toCanvasX(x);
        const py = toCanvasY(y);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(px, py, 4.5, 0, 2 * Math.PI);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        if (plotterState.showLabels && label) {
          ctx.fillStyle = textColor;
          ctx.font = 'bold 11px "Inter", sans-serif';
          const offY = align === 'top' ? -8 : 16;
          ctx.fillText(label, px + 8, py + offY);
        }
      }

      // Draw Curves based on Preset
      const p = plotterState;

      if (p.preset === 'ex1') {
        // Curve 1: Circle x^2 + y^2 = 9 (R=3)
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(cx, cy, 3 * zoom, 0, 2 * Math.PI);
        ctx.stroke();
        drawKeyPoint(3, 0, 'Circle (3,0)', '#2563eb');
        drawKeyPoint(0, 3, '(0,3)', '#2563eb');

        // Curve 2: Ellipse x^2/16 + y^2/9 = 1 (a=4, b=3)
        ctx.strokeStyle = '#8b5cf6';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 4 * zoom, 3 * zoom, 0, 0, 2 * Math.PI);
        ctx.stroke();
        drawKeyPoint(4, 0, 'Ellipse (4,0)', '#8b5cf6');

        // Curve 3: Parabola y^2 = 8x (p=4 ⟹ x = y^2 / 8)
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        const yMinEx1 = toMathY(h);
        const yMaxEx1 = toMathY(0);
        let firstP = true;
        for (let y = yMinEx1; y <= yMaxEx1; y += 0.05) {
          const x = (y * y) / 8;
          const px = toCanvasX(x);
          const py = toCanvasY(y);
          if (firstP) { ctx.moveTo(px, py); firstP = false; }
          else { ctx.lineTo(px, py); }
        }
        ctx.stroke();
        drawKeyPoint(2, 4, 'Parabola (2,4)', '#10b981');
        drawKeyPoint(2, -4, '(2,-4)', '#10b981', 'bottom');

        // Curve 4: Hyperbola x^2/9 - y^2/4 = 1 (a=3, b=2)
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let y = yMinEx1; y <= yMaxEx1; y += 0.05) {
          const x = 3 * Math.sqrt(1 + (y * y) / 4);
          const px = toCanvasX(x);
          const py = toCanvasY(y);
          if (y === yMinEx1) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.beginPath();
        for (let y = yMinEx1; y <= yMaxEx1; y += 0.05) {
          const x = -3 * Math.sqrt(1 + (y * y) / 4);
          const px = toCanvasX(x);
          const py = toCanvasY(y);
          if (y === yMinEx1) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
        drawKeyPoint(3, 0, 'Hyperbola V(3,0)', '#f59e0b', 'bottom');
        drawKeyPoint(-3, 0, 'V(-3,0)', '#f59e0b', 'bottom');

      } else if (p.preset === 'ex3' || (p.preset === 'custom' && p.customType === 'ellipse')) {
        const a = p.a;
        const b = p.b;

        // Tangent box
        if (p.showAsymptotes && p.showTangentBox) {
          ctx.setLineDash([4, 4]);
          ctx.strokeStyle = isDark ? 'rgba(148, 163, 184, 0.4)' : 'rgba(100, 116, 139, 0.4)';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(toCanvasX(-a), toCanvasY(b), 2 * a * zoom, 2 * b * zoom);
          ctx.setLineDash([]);
        }

        // Ellipse curve
        ctx.strokeStyle = '#8b5cf6';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(cx, cy, a * zoom, b * zoom, 0, 0, 2 * Math.PI);
        ctx.stroke();

        // Vertices
        drawKeyPoint(a, 0, `A2(${a}, 0)`, '#8b5cf6');
        drawKeyPoint(-a, 0, `A1(-${a}, 0)`, '#8b5cf6');
        drawKeyPoint(0, b, `B2(0, ${b})`, '#8b5cf6');
        drawKeyPoint(0, -b, `B1(0, -${b})`, '#8b5cf6', 'bottom');

        // Foci
        if (p.showFoci) {
          const c = Math.sqrt(Math.abs(a * a - b * b));
          if (a >= b) {
            drawKeyPoint(c, 0, `F2(${c.toFixed(1)}, 0)`, '#ef4444');
            drawKeyPoint(-c, 0, `F1(-${c.toFixed(1)}, 0)`, '#ef4444');
          } else {
            drawKeyPoint(0, c, `F2(0, ${c.toFixed(1)})`, '#ef4444');
            drawKeyPoint(0, -c, `F1(0, -${c.toFixed(1)})`, '#ef4444', 'bottom');
          }
        }

      } else if (p.preset === 'ex4' || (p.preset === 'custom' && p.customType === 'parabola')) {
        const paramP = p.p;
        const focusX = paramP / 2;
        const directrixX = -paramP / 2;

        // Directrix
        if (p.showDirectrix) {
          ctx.setLineDash([6, 4]);
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(toCanvasX(directrixX), 0);
          ctx.lineTo(toCanvasX(directrixX), h);
          ctx.stroke();
          ctx.setLineDash([]);
          if (p.showLabels) {
            ctx.fillStyle = '#ef4444';
            ctx.font = 'bold 11px "Inter", sans-serif';
            ctx.fillText(`Directrix d: x = -${focusX}`, toCanvasX(directrixX) + 6, 24);
          }
        }

        // Parabola curve
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 3;
        ctx.beginPath();
        const yMinP = toMathY(h);
        const yMaxP = toMathY(0);
        let first = true;
        for (let y = yMinP; y <= yMaxP; y += 0.05) {
          const x = (y * y) / (2 * paramP);
          const px = toCanvasX(x);
          const py = toCanvasY(y);
          if (first) { ctx.moveTo(px, py); first = false; }
          else { ctx.lineTo(px, py); }
        }
        ctx.stroke();

        // Vertex
        drawKeyPoint(0, 0, 'V(0, 0)', '#10b981', 'bottom');

        // Focus
        if (p.showFoci) {
          drawKeyPoint(focusX, 0, `F(${focusX}, 0)`, '#ef4444');
        }

        // Latus Rectum Chord (at x = focusX)
        ctx.strokeStyle = '#8b5cf6';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(toCanvasX(focusX), toCanvasY(-paramP));
        ctx.lineTo(toCanvasX(focusX), toCanvasY(paramP));
        ctx.stroke();

        drawKeyPoint(focusX, paramP, `(${focusX}, ${paramP})`, '#8b5cf6');
        drawKeyPoint(focusX, -paramP, `(${focusX}, -${paramP})`, '#8b5cf6', 'bottom');

      } else if (p.preset === 'ex5' || (p.preset === 'custom' && p.customType === 'hyperbola')) {
        const a = p.a;
        const b = p.b;
        const c = Math.sqrt(a * a + b * b);

        const leftX = toMathX(0);
        const rightX = toMathX(w);

        // Fundamental rectangle
        if (p.showAsymptotes && p.showTangentBox) {
          ctx.setLineDash([4, 4]);
          ctx.strokeStyle = isDark ? 'rgba(148, 163, 184, 0.4)' : 'rgba(100, 116, 139, 0.4)';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(toCanvasX(-a), toCanvasY(b), 2 * a * zoom, 2 * b * zoom);
          ctx.setLineDash([]);
        }

        // Asymptotes lines
        if (p.showAsymptotes) {
          ctx.setLineDash([6, 4]);
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 1.5;

          ctx.beginPath();
          ctx.moveTo(toCanvasX(leftX), toCanvasY((b / a) * leftX));
          ctx.lineTo(toCanvasX(rightX), toCanvasY((b / a) * rightX));
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(toCanvasX(leftX), toCanvasY(-(b / a) * leftX));
          ctx.lineTo(toCanvasX(rightX), toCanvasY(-(b / a) * rightX));
          ctx.stroke();
          ctx.setLineDash([]);

          if (p.showLabels) {
            ctx.fillStyle = '#ef4444';
            ctx.font = 'bold 11px "Inter", sans-serif';
            ctx.fillText(`Asymptote y = ${(b/a).toFixed(2)}x`, w - 160, 24);
            ctx.fillText(`Asymptote y = -${(b/a).toFixed(2)}x`, w - 160, h - 20);
          }
        }

        // Hyperbola Branches
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 3;
        const yMinH = toMathY(h);
        const yMaxH = toMathY(0);

        // Right branch
        ctx.beginPath();
        for (let y = yMinH; y <= yMaxH; y += 0.05) {
          const x = a * Math.sqrt(1 + (y * y) / (b * b));
          const px = toCanvasX(x);
          const py = toCanvasY(y);
          if (y === yMinH) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Left branch
        ctx.beginPath();
        for (let y = yMinH; y <= yMaxH; y += 0.05) {
          const x = -a * Math.sqrt(1 + (y * y) / (b * b));
          const px = toCanvasX(x);
          const py = toCanvasY(y);
          if (y === yMinH) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Vertices
        drawKeyPoint(a, 0, `V2(${a}, 0)`, '#f59e0b');
        drawKeyPoint(-a, 0, `V1(-${a}, 0)`, '#f59e0b');

        // Foci
        if (p.showFoci) {
          drawKeyPoint(c, 0, `F2(${c.toFixed(1)}, 0)`, '#ef4444');
          drawKeyPoint(-c, 0, `F1(-${c.toFixed(1)}, 0)`, '#ef4444');
        }

      } else if (p.preset === 'custom' && p.customType === 'circle') {
        const R = p.R;
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, R * zoom, 0, 2 * Math.PI);
        ctx.stroke();

        drawKeyPoint(0, 0, 'Center (0,0)', '#2563eb', 'bottom');
        drawKeyPoint(R, 0, `(${R}, 0)`, '#2563eb');
        drawKeyPoint(0, R, `(0, ${R})`, '#2563eb');
      }

      ctx.restore();
    }

    // --- Search functionality ---
    document.getElementById('topic-search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      document.querySelectorAll('.nav-item').forEach(el => {
        const text = el.textContent.toLowerCase();
        el.style.display = text.includes(term) ? 'flex' : 'none';
      });
    });

    // --- Theme toggle ---
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    function applyTheme(isDark) {
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      themeIcon.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('math_workbook_theme', isDark ? 'dark' : 'light');
      if (currentTab === 'plotter') {
        drawConicCanvas();
      }
    }

    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      applyTheme(!isDark);
    });

    // Initialize Theme
    const savedTheme = localStorage.getItem('math_workbook_theme') || 
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme === 'dark');

    // Mobile Sidebar toggle
    document.getElementById('toggle-sidebar').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });

    // Window resize handler for canvas
    window.addEventListener('resize', () => {
      if (currentTab === 'plotter') {
        drawConicCanvas();
      }
    });

    // Initialize on Page Load
    window.addEventListener('DOMContentLoaded', () => {
      if (window.location.hash) {
        const hashId = window.location.hash.replace('#', '');
        if (hashId === 'tracker') {
          currentTab = 'tracker';
        } else if (hashId === 'plotter') {
          currentTab = 'plotter';
        } else if (CURRICULUM.some(t => t.id === hashId)) {
          currentTopicId = hashId;
        }
      }
      buildSidebar();
      buildProblemSelector();
      loadCurrentContent();
    });
  </script>
</body>
</html>
